ed for maintenance control and is not for rapid relief of an acute attack.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"Respiratory controllers","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":114,"title":"Isotretinoin iPLEDGE","stem":"An isotretinoin order cannot pass required iPLEDGE authorization checks. What should the technician do?","options":{"A":"Bypass the authorization system for a repeat customer.","B":"Dispense a partial quantity while waiting.","C":"Change the prescriber identifier to one that passes.","D":"Hold dispensing until the pharmacist verifies all required iPLEDGE authorizations."},"correct_answer":"D","explanation":"Isotretinoin dispensing must comply with the iPLEDGE REMS requirements; a missing authorization cannot be bypassed.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":115,"title":"Amoxicillin reconstitution","stem":"The manufacturer's reconstitution directions for a specified amoxicillin 400 mg/5 mL powder state to ADD 71 mL water to make a final 100-mL suspension. How much water should be added?","options":{"A":"100 mL","B":"71 mL","C":"29 mL","D":"200 mL"},"correct_answer":"B","explanation":"The manufacturer explicitly instructs adding 71 mL of water. Powder displacement means the volume added need not equal the final prepared volume.","nha_alignment":null,"game_category":"CALCULATIONS","curriculum_hold":"Reconstitution principles","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":116,"title":"FDA MedWatch","stem":"Which FDA program accepts voluntary reports of suspected adverse events or quality problems involving medications?","options":{"A":"VAERS only","B":"DEA CSOS","C":"MedWatch","D":"Orange Book"},"correct_answer":"C","explanation":"FDA MedWatch collects voluntary adverse-event and product-problem reports; vaccine events use VAERS as appropriate.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":117,"title":"IV drip rate","stem":"An IV order is 500 mL over 4 hours with a tubing drop factor of 15 gtt/mL. Calculate the whole-number drop rate.","options":{"A":"31 gtt/min","B":"21 gtt/min","C":"47 gtt/min","D":"63 gtt/min"},"correct_answer":"A","explanation":"500 mL × (15 gtt/mL) ÷ (4 hr × 60 min/hr) = 31.25 gtt/min; round to a practical whole drop rate of 31 gtt/min.","nha_alignment":null,"game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 IV flow rate","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":118,"title":"PHI destruction","stem":"An outdated prescription label contains patient-identifying information. Where should it be discarded?","options":{"A":"In a public trash bin","B":"In the regular recycling without shredding","C":"Left attached to a return-stock vial visible to customers","D":"In the approved confidential-destruction receptacle following pharmacy policy"},"correct_answer":"D","explanation":"Protected health information must be disposed of using approved secure-destruction procedures.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":119,"title":"Pharmacist verification","stem":"A technician completes prescription filling and sees that required pharmacist final verification is still pending. What should happen?","options":{"A":"Release it because counting is finished.","B":"Allow the patient to sign and leave before the check.","C":"Hold the prescription from release until pharmacist verification is completed.","D":"Ask another patient to confirm the tablets."},"correct_answer":"C","explanation":"A technician must not release a prescription before the required pharmacist final verification.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":120,"title":"Unit-dose traceability","stem":"Which set of information is important for hospital unit-dose product identification and traceability?","options":{"A":"Only the patient's first name","B":"Medication identity/strength plus appropriate lot and expiration or BUD identification","C":"Only the purchase price","D":"Only the name of the person who delivered the stock"},"correct_answer":"B","explanation":"Unit-dose labeling and records must support product identity and safe traceability, including relevant lot and expiry/BUD information under policy.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":121,"title":"Endocrine · SGLT2 Inhibitors","stem":"A pharmacy technician receives a prescription for Jardiance (empagliflozin) for a patient with type 2 diabetes. Which therapeutic class should the technician recognize?","options":{"A":"Sulfonylurea","B":"Sodium-glucose cotransporter-2 (SGLT2) inhibitor","C":"Dipeptidyl peptidase-4 (DPP-4) inhibitor","D":"Biguanide"},"correct_answer":"B","explanation":"Empagliflozin is an SGLT2 inhibitor that reduces renal glucose reabsorption and increases urinary glucose excretion.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":122,"title":"Psychiatric · Antidepressant Classification","stem":"A pharmacy receives a prescription for Cymbalta (duloxetine) delayed-release capsules for an adult patient with depression. Which therapeutic drug class best describes duloxetine?","options":{"A":"Serotonin-norepinephrine reuptake inhibitor (SNRI)","B":"Selective serotonin reuptake inhibitor (SSRI)","C":"Tricyclic antidepressant (TCA)","D":"Monoamine oxidase inhibitor (MAOI)"},"correct_answer":"A","explanation":"Duloxetine is an SNRI used for major depressive disorder and several other conditions. [CURRICULUM HOLD: Psychiatric Module]","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":123,"title":"Respiratory · OTC Nasal Medication","stem":"A pharmacist asks a technician to locate OTC Flonase Allergy Relief (fluticasone propionate) nasal spray. Which therapeutic class and route correctly identify this product?","options":{"A":"Oral antihistamine taken by mouth","B":"Inhaled beta-2 agonist delivered to the lungs","C":"Intranasal corticosteroid sprayed into the nose","D":"Topical antibiotic applied to the skin"},"correct_answer":"C","explanation":"Flonase Allergy Relief contains fluticasone propionate, a glucocorticoid intended for intranasal allergy symptom relief.","nha_alignment":"K.57 · K.59 · K.65","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":124,"title":"OTC Products · Drug Facts Label","stem":"A technician compares two OTC cold products after the pharmacist requests an ingredient check. Which section of the FDA-standardized Drug Facts label lists the substances responsible for the products' therapeutic effects and the amount per dosage unit?","options":{"A":"Other Information","B":"Inactive Ingredients","C":"Questions or Comments","D":"Active Ingredient(s)"},"correct_answer":"D","explanation":"The Active Ingredient(s) section identifies the drug substances responsible for therapeutic effects and their amounts per dosage unit.","nha_alignment":"K.104 · 4B.11","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":125,"title":"Patient Safety · Correct Patient Identification","stem":"Two patients named Jordan Lee have profiles in the same pharmacy system, but their dates of birth differ. A prescription arrives for Jordan Lee. What should the technician do before selecting a patient profile?","options":{"A":"Use whichever Jordan Lee profile was opened most recently.","B":"Verify the intended patient with an additional identifier, such as date of birth, according to pharmacy procedures.","C":"Choose the profile with the most recently filled prescription.","D":"Process the medication under either profile and correct the name later."},"correct_answer":"B","explanation":"Matching the patient's name alone is insufficient when duplicate names exist. The technician must check an additional identifier (e.g., DOB, address).","nha_alignment":"5E · 5F · K.141","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":126,"title":"Sterile Compounding · Primary Engineering Controls","stem":"During a sterile-compounding orientation, a technician is shown a properly operating ISO Class 5 primary engineering control. What is its primary function when preparing a nonhazardous sterile medication?","options":{"A":"Sterilize every medication automatically after mixing.","B":"Eliminate the need for hand hygiene and aseptic technique.","C":"Provide HEPA-filtered, controlled air that helps protect exposed critical sites from contamination.","D":"Allow any medication to be compounded safely without regard to its compatibility."},"correct_answer":"C","explanation":"An appropriate primary engineering control (PEC) provides ISO Class 5 air quality via HEPA filtration to protect critical sites during sterile compounding. [CURRICULUM HOLD: Sterile Compounding Overview]","nha_alignment":"K.126 · K.138 · 4D.3","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":127,"title":"Workplace Safety · Safety Data Sheets","stem":"A technician discovers a spill of a hazardous cleaning chemical used in the pharmacy. Which workplace resource provides information about the chemical's hazards, appropriate protective equipment, and accidental-release procedures?","options":{"A":"The chemical's Safety Data Sheet (SDS), together with facility spill procedures","B":"The patient's medication history","C":"The FDA Orange Book","D":"The insurance formulary"},"correct_answer":"A","explanation":"An OSHA-format Safety Data Sheet (SDS) includes hazard information, spill response measures (Section 6), and personal protective equipment (Section 8).","nha_alignment":"K.16 · 2A.7 · 5A","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":128,"title":"Medical Terminology · Cardiovascular","stem":"While reading a patient profile, a technician encounters the medical term 'bradycardia.' What does this term mean?","options":{"A":"Abnormally rapid heart rate","B":"Inflammation of the heart muscle","C":"Irregular blood glucose level","D":"Abnormally slow heart rate"},"correct_answer":"D","explanation":"The prefix brady- means slow, and -cardia refers to the heart rate. Bradycardia refers to an abnormally slow heart rate.","nha_alignment":"K.9 · 1F","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":129,"title":"Insurance · Tiered Copays","stem":"An insurance claim shows that a prescription is on the patient's Tier 3 formulary level rather than Tier 1. Which statement best explains how this can affect the patient's prescription cost?","options":{"A":"A Tier 3 medication is automatically prohibited from being dispensed.","B":"The medication's tier may affect the patient's copay or other cost-sharing; the actual amount must be confirmed through plan information or claim processing.","C":"All Tier 3 medications have an identical copay across insurance companies.","D":"Tier placement changes the prescribed medication's generic name and strength."},"correct_answer":"B","explanation":"Tiered drug formularies assign different cost-sharing levels to medications; lower tiers usually carry lower copays than higher tiers.","nha_alignment":"K.89 · 4A.10","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":130,"title":"PHRA 1009 · Alligation","stem":"A technician must prepare a 10% w/w ointment by combining two compatible ointments of the same drug: one at 20% w/w and the other at 5% w/w. Using alligation, what is the required ratio of 20% ointment to 5% ointment by weight?","options":{"A":"1 part to 2 parts","B":"2 parts to 1 part","C":"1 part to 1 part","D":"3 parts to 1 part"},"correct_answer":"A","explanation":"High (20%) parts = 10 - 5 = 5 parts; Low (5%) parts = 20 - 10 = 10 parts. Ratio 20%:5% = 5:10 = 1:2. [CURRICULUM HOLD FOR PHRA 1009: Alligation]","nha_alignment":"K.120 · 4C.5","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":131,"title":"Endocrine · GLP-1 Receptor Agonists","stem":"A pharmacy receives a prescription for Ozempic (semaglutide) subcutaneous injection for an adult with type 2 diabetes. Which therapeutic drug class should the technician recognize?","options":{"A":"Sodium-glucose cotransporter-2 (SGLT2) inhibitor","B":"Glucagon-like peptide-1 (GLP-1) receptor agonist","C":"Dipeptidyl peptidase-4 (DPP-4) inhibitor","D":"Rapid-acting insulin analog"},"correct_answer":"B","explanation":"Semaglutide is a GLP-1 receptor agonist administered via subcutaneous injection to improve glycemic control in type 2 diabetes.","nha_alignment":"K.57 · K.59 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":132,"title":"Cardiovascular/Renal · Loop Diuretics","stem":"A prescription for Lasix (furosemide) is received to treat edema associated with heart failure. Which drug classification correctly identifies furosemide?","options":{"A":"Loop diuretic","B":"Thiazide diuretic","C":"Potassium-sparing diuretic","D":"Angiotensin-converting enzyme inhibitor"},"correct_answer":"A","explanation":"Furosemide is a loop diuretic that inhibits sodium and chloride reabsorption in the ascending loop of Henle.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":133,"title":"Anti-Infectives · Antiviral Recognition","stem":"A prescription is received for Valtrex (valacyclovir) to treat herpes zoster (shingles). Which therapeutic class should the technician recognize?","options":{"A":"Cephalosporin antibiotic","B":"Azole antifungal","C":"Antiviral medication","D":"Nonsteroidal anti-inflammatory drug"},"correct_answer":"C","explanation":"Valacyclovir is a nucleoside analogue antiviral drug used to treat viral infections including herpes zoster.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":134,"title":"Immunizations · Vaccine Recognition","stem":"During a pharmacy immunization review, a technician encounters the brand Shingrix. Which disease is this recombinant vaccine intended to prevent?","options":{"A":"Seasonal influenza","B":"Respiratory syncytial virus (RSV) disease","C":"Human papillomavirus (HPV) infection","D":"Herpes zoster (shingles)"},"correct_answer":"D","explanation":"Shingrix is the recombinant zoster vaccine approved for the prevention of shingles (herpes zoster). [CURRICULUM HOLD: Vaccine Schedules]","nha_alignment":"K.73 · 3B.5","game_category":"PATIENT SAFETY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":135,"title":"High-Alert Medications · Potassium Chloride","stem":"In a hospital pharmacy, a technician notices a concentrated potassium chloride injection vial placed in a bin designated for ready-to-administer IV products. What is the safest response?","options":{"A":"Assume it is ready for direct IV injection because it is a sterile product.","B":"Move it to an unrestricted patient-care area for faster access.","C":"Stop the selection, segregate the concentrate according to facility procedures, and alert the pharmacist about the storage error.","D":"Remove its warning label to prevent confusion with diluted potassium chloride products."},"correct_answer":"C","explanation":"Concentrated potassium chloride injection is an ISMP high-alert drug. Direct IV injection is fatal; concentrates must be segregated and diluted. [CURRICULUM HOLD: High-Alert Safety]","nha_alignment":"K.151 · 5D · 5G","game_category":"PATIENT SAFETY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":136,"title":"Controlled Substances · Electronic Rx Transfers","stem":"A patient requests that an unfilled electronic Schedule II prescription be transferred from one DEA-registered retail pharmacy to another for its initial filling. State law permits the transfer, and both pharmacies can perform it. Which statement accurately reflects the federal DEA procedure?","options":{"A":"A pharmacy technician may fax a printed copy as the transferred prescription.","B":"The prescription may be repeatedly transferred until the patient finds available stock.","C":"The receiving technician may recreate the prescription as a new verbal order.","D":"The prescription may be transferred once in its electronic form directly between the authorized pharmacists, following DEA requirements."},"correct_answer":"D","explanation":"Federal DEA regulations allow a one-time transfer of an unfilled electronic controlled substance prescription (Schedules II-V) directly between pharmacists electronically.","nha_alignment":"K.53 · 2B.4","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":"Texas permits a qualifying initial-fill electronic Schedule II prescription transfer when authorized technology and other requirements are met. This does not authorize Schedule II refills. See TSBP Rule FAQ 23 and DEA 21 CFR §1306.08."},{"id":137,"title":"Medicare · Durable Medical Equipment","stem":"A patient with Original Medicare presents an order for a prescribed home blood glucose monitor. Which part of Medicare generally covers an eligible blood glucose monitor as durable medical equipment?","options":{"A":"Medicare Part B","B":"Medicare Part A","C":"Medicare Part D exclusively","D":"Medigap as the primary Medicare benefit"},"correct_answer":"A","explanation":"Medicare Part B covers durable medical equipment (DME), including prescribed blood glucose monitors and testing supplies.","nha_alignment":"K.90 · K.91 · 4A.12","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":138,"title":"Drug Utilization Review · Warfarin Interaction","stem":"During prescription processing, the computer generates a potential drug-interaction alert for a patient taking warfarin who has received a new prescription for Bactrim DS. What should the technician do?","options":{"A":"Override the alert because antibiotics cannot affect anticoagulants.","B":"Advise the patient to double the warfarin dose while taking Bactrim.","C":"Change the antibiotic to another product without prescriber or pharmacist authorization.","D":"Pause processing and alert the pharmacist for evaluation of the potential interaction."},"correct_answer":"D","explanation":"Bactrim DS (sulfamethoxazole/trimethoprim) significantly increases warfarin's anticoagulant effect, increasing bleeding risk. The technician must refer the alert to the pharmacist.","nha_alignment":"K.71 · K.84 · 4A.11","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":139,"title":"PHRA 1009 · Inhaler Days' Supply","stem":"An inhaler contains 120 labeled actuations available for prescribed doses. The directions are 'Inhale 2 puffs twice daily.' Assuming no additional actuations are needed for priming or testing, what is the days' supply?","options":{"A":"15 days","B":"30 days","C":"60 days","D":"120 days"},"correct_answer":"B","explanation":"2 puffs twice daily = 4 puffs daily. 120 total puffs ÷ 4 puffs/day = 30 days' supply. [CURRICULUM HOLD FOR PHRA 1009: Days' Supply Math]","nha_alignment":"K.111 · 4C.3","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":140,"title":"Prescription Security · Possible Alteration","stem":"A technician receives a handwritten prescription whose medication strength appears to have been overwritten in a different ink. There is no accompanying clarification. What should the technician do?","options":{"A":"Enter the highest strength that the writing could represent.","B":"Fill the lowest available strength to avoid a possible overdose.","C":"Hold processing and refer the suspicious alteration to the pharmacist for verification through approved procedures.","D":"Rewrite the strength neatly and continue dispensing."},"correct_answer":"C","explanation":"Suspicious alterations or illegible entries must be held and referred to the pharmacist for verification with the prescriber.","nha_alignment":"K.107 · 4B.1 · 5G","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":141,"title":"Endocrine · DPP-4 Inhibitors","stem":"A pharmacy technician receives a prescription for Januvia (sitagliptin) for a patient with type 2 diabetes. Which therapeutic drug class correctly identifies Januvia?","options":{"A":"Sodium-glucose cotransporter-2 (SGLT2) inhibitor","B":"Sulfonylurea","C":"Dipeptidyl peptidase-4 (DPP-4) inhibitor","D":"Biguanide"},"correct_answer":"C","explanation":"Sitagliptin (Januvia) is an oral DPP-4 inhibitor that increases incretin hormone levels to regulate blood glucose.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":142,"title":"Musculoskeletal · Gout Therapy","stem":"A prescription for Colcrys (colchicine) is received. Which indication correctly describes an FDA-approved use of this medication?","options":{"A":"Treatment and prevention of gout flares","B":"Lowering uric acid production through xanthine oxidase inhibition","C":"Treatment of bacterial joint infections","D":"Replacement of deficient thyroid hormones"},"correct_answer":"A","explanation":"Colchicine (Colcrys) is an anti-inflammatory drug approved for the prophylaxis and treatment of acute gout flares.","nha_alignment":"K.61 · K.62 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":143,"title":"Medication Safety · Fentanyl Patches","stem":"A patient picking up fentanyl transdermal patches asks the pharmacy technician whether cutting a patch in half would provide a lower dose. What is the most appropriate response?","options":{"A":"Cut the patch into equal halves using sterile scissors.","B":"Save the unused half in its original wrapper for the next dose.","C":"Cover half the patch with adhesive tape to reduce absorption.","D":"Do not cut the patch; refer the question to the pharmacist for safe dosing instructions."},"correct_answer":"D","explanation":"Fentanyl patches must never be cut or damaged; doing so can cause rapid drug release and fatal overdose. Refer to the pharmacist. [CURRICULUM HOLD: Transdermal Safety]","nha_alignment":"K.59 · K.60 · K.151 · 5D","game_category":"PATIENT SAFETY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":144,"title":"PHRA 1009 · Milliequivalent Calculation","stem":"For a pharmacy mathematics exercise, a potassium chloride oral solution is labeled 20 mEq per 15 mL. How many milliliters contain 40 mEq?","options":{"A":"15 mL","B":"30 mL","C":"40 mL","D":"60 mL"},"correct_answer":"B","explanation":"40 mEq × (15 mL / 20 mEq) = 30 mL. [CURRICULUM HOLD FOR PHRA 1009: mEq Calculations]","nha_alignment":"K.110 · 4C.2","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":145,"title":"Federal Pharmacy Law · Prescription vs. OTC","stem":"Which federal amendment established a clearer legal distinction between prescription-only medications and medications that may be sold without a prescription?","options":{"A":"Federal Food, Drug, and Cosmetic Act of 1938","B":"Kefauver-Harris Amendment of 1962","C":"Controlled Substances Act of 1970","D":"Durham-Humphrey Amendment of 1951"},"correct_answer":"D","explanation":"The Durham-Humphrey Amendment of 1951 created the legal distinction between prescription (legend) drugs and OTC medications.","nha_alignment":"K.30 · 2A.1","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":146,"title":"Patient Care · Medication Adherence","stem":"During a refill conversation, a patient tells a pharmacy technician that several evening doses of a maintenance medication have been missed because of an irregular work schedule. What should the technician do?","options":{"A":"Document the adherence concern according to pharmacy procedures and refer the patient to the pharmacist for appropriate support.","B":"Advise the patient to take two doses the following morning.","C":"Change the prescription directions to once daily without authorization.","D":"Remove the medication from the active profile because doses have been missed."},"correct_answer":"A","explanation":"Technicians identify adherence barriers and refer patients to the pharmacist for counseling and therapy management.","nha_alignment":"K.7 · K.146 · 1D · 5C","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":147,"title":"Compounding · Physical Incompatibility","stem":"During sterile-compounding training, two solutions expected to produce a clear preparation are combined, but the mixture unexpectedly develops visible particles and cloudiness. What is the technician's most appropriate action?","options":{"A":"Filter out the visible particles and dispense the preparation.","B":"Add extra sterile water until the preparation looks clear.","C":"Stop, keep the preparation from use, and notify the pharmacist to investigate the possible incompatibility.","D":"Shake the preparation vigorously and dispense it if the particles disappear."},"correct_answer":"C","explanation":"Unexpected haze or precipitation indicates physical incompatibility. Quarantine the preparation and report to the pharmacist. [CURRICULUM HOLD: Compounding Incompatibilities]","nha_alignment":"K.72 · K.133 · 4D.12","game_category":"PATIENT SAFETY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":148,"title":"OTC Labeling · Auxiliary Warnings","stem":"A pharmacist asks a technician to identify the appropriate use warning for Voltaren Arthritis Pain (diclofenac sodium 1%) topical gel. Which warning is consistent with the product's FDA-approved OTC labeling?","options":{"A":"For oral use only","B":"For external use only","C":"Keep refrigerated at all times","D":"Swallow whole; do not crush"},"correct_answer":"B","explanation":"Voltaren Arthritis Pain is a topical NSAID gel labeled for external use only.","nha_alignment":"K.65 · K.102 · 4B.8","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":149,"title":"Prescription Processing · Refill Authorization","stem":"A patient requests another fill of a noncontrolled maintenance medication, but the pharmacy record shows no authorized refills remaining. What should the technician do first?","options":{"A":"Create an additional refill in the pharmacy system.","B":"Change the prescription quantity to make the previous authorization last longer.","C":"Initiate a refill-authorization request through approved pharmacy procedures and refer any urgent supply concerns to the pharmacist.","D":"Dispense the medication and request authorization after the patient leaves."},"correct_answer":"C","explanation":"When zero refills remain, the technician initiates a refill authorization request to the prescriber and escalates urgent needs to the pharmacist.","nha_alignment":"K.77 · 4A.4","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":150,"title":"PHRA 1009 · Safe-Dose Range","stem":"In a practice problem, a hypothetical medication has a supplied safe-dose range of 10–15 mg/kg/day. A child weighs 18 kg, and the prescribed regimen is 120 mg twice daily. How does the prescribed total daily amount compare with the given range?","options":{"A":"It is within the supplied range.","B":"It is below the supplied range.","C":"It exceeds the supplied range.","D":"The range cannot be checked without knowing the medication's brand name."},"correct_answer":"A","explanation":"Min = 18 kg × 10 mg/kg/day = 180 mg/day. Max = 18 kg × 15 mg/kg/day = 270 mg/day. Prescribed = 120 mg × 2 = 240 mg/day (within range). [CURRICULUM HOLD FOR PHRA 1009: Safe-Dose Math]","nha_alignment":"K.114 · K.144 · 4C.2","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":151,"title":"Neurology · Alzheimer's Medications","stem":"A pharmacy receives a prescription for Aricept (donepezil) for a patient with Alzheimer's dementia. Which drug class correctly identifies donepezil?","options":{"A":"Dopamine receptor agonist","B":"Acetylcholinesterase inhibitor","C":"NMDA receptor antagonist","D":"Selective serotonin reuptake inhibitor"},"correct_answer":"B","explanation":"Donepezil (Aricept) is an acetylcholinesterase inhibitor used for symptomatic treatment of Alzheimer's dementia. [CURRICULUM HOLD: Neurologic Module]","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":152,"title":"Genitourinary · BPH Treatment","stem":"A technician receives a prescription for Proscar (finasteride) 5 mg for symptomatic benign prostatic hyperplasia (BPH). Which therapeutic class is correct?","options":{"A":"Alpha-1 adrenergic blocker","B":"5-HT3 receptor antagonist","C":"Loop diuretic","D":"5-alpha-reductase inhibitor"},"correct_answer":"D","explanation":"Finasteride is a 5-alpha-reductase inhibitor that blocks conversion of testosterone to dihydrotestosterone (DHT). [CURRICULUM HOLD: Genitourinary Module]","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":153,"title":"Cardiovascular · Calcium Channel Blockers","stem":"A prescription for Norvasc (amlodipine) is received for a patient with hypertension. What is amlodipine's therapeutic classification?","options":{"A":"Dihydropyridine calcium channel blocker","B":"Angiotensin II receptor blocker","C":"Thiazide diuretic","D":"Beta-1 selective adrenergic blocker"},"correct_answer":"A","explanation":"Amlodipine (Norvasc) is a dihydropyridine calcium channel blocker that produces arterial vasodilation.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":154,"title":"Patient Safety · Poison Control","stem":"A caregiver calls the pharmacy because a toddler may have swallowed several tablets from a relative's medication bottle. The child is currently awake and breathing normally. What should the technician do?","options":{"A":"Tell the caregiver to wait until symptoms appear before seeking advice.","B":"Recommend inducing vomiting to remove the tablets.","C":"Immediately direct the caregiver to Poison Help at 1-800-222-1222 and alert the pharmacist.","D":"Recommend giving milk to neutralize the medication."},"correct_answer":"C","explanation":"Suspected poisoning requires immediate connection to Poison Help (1-800-222-1222). Do not recommend home remedies.","nha_alignment":"K.24 · 1H · 1O","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":155,"title":"Inventory · FDA Recall Classification","stem":"The FDA classifies a medication recall as one in which use of the product may cause temporary or medically reversible adverse health consequences, or the probability of serious consequences is remote. Which recall class is this?","options":{"A":"Class II","B":"Class I","C":"Class III","D":"Market withdrawal"},"correct_answer":"A","explanation":"FDA Class II recalls involve potential temporary or medically reversible health problems, or remote risk of serious harm.","nha_alignment":"K.11 · 1M","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":156,"title":"Controlled Substances · Prescription Monitoring","stem":"A pharmacist explains that the state Prescription Drug Monitoring Program (PDMP) can help identify potentially unsafe patterns involving controlled-substance prescriptions. What is the primary purpose of a PDMP?","options":{"A":"List generic medications that the FDA considers therapeutically equivalent to brand-name drugs.","B":"Authorize pharmacies to dispense medications requiring REMS enrollment.","C":"Assign National Drug Code numbers to newly manufactured medications.","D":"Maintain an electronic record of controlled-substance prescription activity to support patient safety and oversight."},"correct_answer":"D","explanation":"PDMPs are state electronic databases tracking controlled-substance prescriptions to support patient safety and identify diversion.","nha_alignment":"K.56","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":157,"title":"Medication Safety · Error-Prone Abbreviations","stem":"A medication order contains the abbreviation 'MSO4' instead of a fully written drug name. Which action best prevents a potentially serious medication-selection error?","options":{"A":"Assume MSO4 means morphine sulfate and proceed without clarification.","B":"Stop and refer the order for clarification, ensuring the complete medication name is used.","C":"Interpret MSO4 as magnesium sulfate whenever the order is handwritten.","D":"Select whichever of the two medications is currently available in the pharmacy."},"correct_answer":"B","explanation":"MSO4 (morphine sulfate) and MgSO4 (magnesium sulfate) are ISMP error-prone abbreviations and must be written out completely.","nha_alignment":"K.81 · K.153 · 5D","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":158,"title":"Insurance · Processing a Third-Party Claim","stem":"A pharmacy claim cannot be routed because a required Processor Control Number (PCN) is missing. What is the PCN used for?","options":{"A":"Identifying the prescriber's professional license number.","B":"Displaying the manufacturer's expiration date for the medication.","C":"Helping direct the claim to the appropriate payer processing system, usually in combination with the BIN.","D":"Indicating whether the medication requires refrigeration."},"correct_answer":"C","explanation":"The PCN (Processor Control Number) is used alongside the BIN to route electronic claims to the correct PBM sub-network.","nha_alignment":"K.85 · 4A.5","game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":159,"title":"Sterile Compounding · Ampule Preparation","stem":"During sterile-compounding training, a technician must withdraw liquid medication from a glass ampule. Which device is generally used during withdrawal to reduce the chance of drawing glass particles into the syringe?","options":{"A":"A filter needle","B":"An oral dosing syringe","C":"A needleless IV connector","D":"A vented spike used for an IV fluid bag"},"correct_answer":"A","explanation":"A sterile filter needle (or filter straw) must be used when drawing solution from a glass ampule to remove glass fragments. [CURRICULUM HOLD: Compounding Equipment]","nha_alignment":"K.127 · 4D.5 · 4D.7","game_category":"PATIENT SAFETY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":160,"title":"PHRA 1009 · Pharmacy Business Calculations","stem":"A pharmacy purchases a medication for $48.00 and applies a 25% markup based on its acquisition cost. What is the selling price before any taxes or additional fees?","options":{"A":"$12.00","B":"$48.00","C":"$54.00","D":"$60.00"},"correct_answer":"D","explanation":"Markup = $48.00 × 0.25 = $12.00. Selling price = $48.00 + $12.00 = $60.00. [CURRICULUM HOLD FOR PHRA 1009: Business Math]","nha_alignment":"K.122 · 4C.8","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":161,"title":"Cardiovascular · Calcium Channel Blockers","stem":"A pharmacy receives a prescription for Cardizem CD (diltiazem hydrochloride extended-release capsules) to treat hypertension. Which drug class correctly identifies diltiazem?","options":{"A":"Dihydropyridine calcium channel blocker","B":"Angiotensin II receptor blocker","C":"Nondihydropyridine calcium channel blocker","D":"Beta-1 selective blocker"},"correct_answer":"C","explanation":"Diltiazem is a nondihydropyridine calcium channel blocker that slows heart rate and AV node conduction while lowering blood pressure.","nha_alignment":"K.57 · K.59 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":162,"title":"Anti-Infectives · Clindamycin","stem":"A prescription is received for Cleocin HCl (clindamycin hydrochloride) capsules to treat a susceptible bacterial infection. Which antibiotic class is correct?","options":{"A":"Macrolide","B":"Lincosamide","C":"Cephalosporin","D":"Fluoroquinolone"},"correct_answer":"B","explanation":"Clindamycin belongs to the lincosamide antibiotic class and carries a Boxed Warning for C. difficile-associated diarrhea.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":163,"title":"Genitourinary · Overactive Bladder","stem":"A technician receives a prescription for Myrbetriq (mirabegron extended-release tablets) for an adult with overactive bladder. Which pharmacologic class describes mirabegron?","options":{"A":"Antimuscarinic agent","B":"Alpha-1 adrenergic blocker","C":"5-alpha-reductase inhibitor","D":"Beta-3 adrenergic agonist"},"correct_answer":"D","explanation":"Mirabegron is a beta-3 adrenergic agonist that relaxes detrusor smooth muscle to treat overactive bladder. [CURRICULUM HOLD: Genitourinary Module]","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":164,"title":"Respiratory · Cough Medication","stem":"A patient receives Tessalon (benzonatate) capsules for symptomatic cough relief. Which therapeutic class best describes benzonatate?","options":{"A":"Nonopioid antitussive","B":"Expectorant","C":"Leukotriene receptor antagonist","D":"Oral nasal decongestant"},"correct_answer":"A","explanation":"Benzonatate is a nonopioid antitussive that anesthetizes stretch receptors in respiratory passages.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":165,"title":"Medication Safety · NCC MERP Error Categories","stem":"A medication-dispensing error reaches a patient, who takes the medication. Follow-up confirms that no harm occurred and no additional monitoring or intervention was needed. Under the NCC MERP Medication Error Index, how is this error categorized?","options":{"A":"Category A","B":"Category B","C":"Category D","D":"Category C"},"correct_answer":"D","explanation":"NCC MERP Category C means an error reached the patient but caused no harm. Category B is an error that did not reach the patient; Category D reaches the patient and requires monitoring and/or intervention to prevent harm. [CURRICULUM HOLD: NCC MERP error taxonomy]","nha_alignment":"K.160 · NCC MERP Index","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":166,"title":"Controlled Substances · Expired Inventory","stem":"During an inventory review, a technician finds an expired Schedule II medication in the pharmacy's controlled-substance stock. Which action is most appropriate?","options":{"A":"Remove it from active stock, secure it, and notify the pharmacist for DEA-compliant inventory handling and disposal.","B":"Place it in an ordinary trash container after removing the label.","C":"Transfer it into the public medication take-back receptacle used for patient returns.","D":"Dispense it if the package remains sealed and the expiration date passed recently."},"correct_answer":"A","explanation":"Expired pharmacy controlled substance stock must be segregated in secure storage and destroyed via DEA Form 41 or reverse distributor transfer.","nha_alignment":"K.54 · 2B.7 · 1L","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":167,"title":"Pharmacy References · IV Compatibility","stem":"A hospital pharmacist asks a technician to locate a professional reference for researching whether two injectable medications are compatible when administered through the same IV Y-site. Which resource is most appropriate?","options":{"A":"FDA Orange Book","B":"ASHP Injectable Drug Information, formerly Handbook on Injectable Drugs","C":"FDA Purple Book","D":"DEA Controlled Substance Schedules"},"correct_answer":"B","explanation":"ASHP Injectable Drug Information (Trissel's) is the standard reference for IV drug stability and Y-site compatibility. [CURRICULUM HOLD: Drug Information References]","nha_alignment":"K.22 · 1O","game_category":"PHARMACY PRACTICE","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":168,"title":"Occupational Safety · Needlestick Exposure","stem":"While assisting with an immunization clinic, a pharmacy technician accidentally punctures a finger with a needle that was just used on a patient. What is the most appropriate immediate response?","options":{"A":"Squeeze the wound vigorously to force out potentially contaminated blood.","B":"Continue working and report the injury only if symptoms develop.","C":"Wash the site with soap and water, report the exposure immediately, and obtain prompt medical evaluation.","D":"Apply household bleach directly to the wound before finishing the shift."},"correct_answer":"C","explanation":"CDC bloodborne pathogen protocol mandates immediate washing with soap and water, exposure reporting, and clinical evaluation. [CURRICULUM HOLD: Universal Precautions]","nha_alignment":"K.124 · 4D.1 · 4D.2","game_category":"PATIENT SAFETY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":169,"title":"Patient Care · Medication Reconciliation","stem":"A patient has recently been discharged from the hospital. The pharmacist asks a technician to assist with medication reconciliation. Which activity is within the technician's supporting role?","options":{"A":"Determine independently which medications the patient should stop taking.","B":"Change the patient's prescriptions to match the hospital discharge list without pharmacist review.","C":"Provide a final clinical assessment of all medication interactions.","D":"Collect and compare the available home-medication and discharge lists, identify discrepancies, and refer them to the pharmacist."},"correct_answer":"D","explanation":"Technicians support medication reconciliation by gathering and comparing medication lists and flagging discrepancies for pharmacist evaluation.","nha_alignment":"K.6 · 1C","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":170,"title":"PHRA 1009 · Insulin Days' Supply","stem":"A prescription is written for U-100 insulin supplied in a 10 mL vial. The directions are 'Inject 16 units every morning and 24 units every evening.' Assuming all labeled insulin is available and no extra insulin is used for priming or waste, what is the days' supply?","options":{"A":"20 days","B":"40 days","C":"25 days","D":"10 days"},"correct_answer":"C","explanation":"Total units = 10 mL × 100 units/mL = 1,000 units. Daily dose = 16 + 24 = 40 units/day. Days' supply = 1,000 ÷ 40 = 25 days. [CURRICULUM HOLD FOR PHRA 1009: Insulin Days' Supply]","nha_alignment":"K.111 · 4C.3","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":171,"title":"Cardiovascular · Lipid-Lowering Drugs","stem":"A pharmacy receives a prescription for Zetia (ezetimibe) for a patient with elevated LDL cholesterol. Which mechanism best describes this medication?","options":{"A":"Inhibits HMG-CoA reductase to reduce cholesterol production in the liver","B":"Inhibits cholesterol absorption in the small intestine","C":"Binds bile acids in the gastrointestinal tract","D":"Inhibits PCSK9 to increase LDL-receptor recycling"},"correct_answer":"B","explanation":"Ezetimibe (Zetia) inhibits brush-border intestinal absorption of cholesterol via the NPC1L1 transporter.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":172,"title":"Neurology · Migraine Prevention","stem":"A patient receives Topamax (topiramate) for preventive treatment of migraine headaches. Which statement about this medication is correct?","options":{"A":"It is a triptan taken specifically for immediate relief during a migraine attack.","B":"It is an opioid analgesic used to treat severe breakthrough headache pain.","C":"It is an anticonvulsant that also has an approved indication for migraine prevention.","D":"It is a beta blocker used only for hypertension."},"correct_answer":"C","explanation":"Topiramate is an anticonvulsant approved for seizure disorders and migraine prophylaxis. [CURRICULUM HOLD: Neurologic Module]","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":173,"title":"Ophthalmic · Glaucoma Treatment","stem":"A prescription is received for Trusopt (dorzolamide hydrochloride) 2% ophthalmic solution to lower elevated intraocular pressure. Which pharmacologic class is correct?","options":{"A":"Carbonic anhydrase inhibitor","B":"Prostaglandin analogue","C":"Ophthalmic beta blocker","D":"Alpha-2 adrenergic agonist"},"correct_answer":"A","explanation":"Dorzolamide is a topical carbonic anhydrase inhibitor that reduces aqueous humor secretion in the eye. [CURRICULUM HOLD: Ophthalmic Module]","nha_alignment":"K.57 · K.60 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":174,"title":"Anti-Infectives · Nitroimidazoles","stem":"A pharmacy technician encounters a prescription for Flagyl (metronidazole) to treat a susceptible anaerobic bacterial infection. Which drug class best identifies metronidazole?","options":{"A":"Aminoglycoside antibiotic","B":"Penicillin antibiotic","C":"Tetracycline antibiotic","D":"Nitroimidazole antimicrobial"},"correct_answer":"D","explanation":"Metronidazole is a synthetic nitroimidazole antimicrobial active against anaerobic bacteria and protozoa.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":175,"title":"Federal Law · HIPAA Minimum Necessary","stem":"A pharmacist receives a request from a patient's treating physician for medication-history information needed for treatment. Under the federal HIPAA Privacy Rule, which statement about the minimum necessary standard is correct?","options":{"A":"The pharmacist must obtain the patient's written authorization before every treatment-related disclosure.","B":"The minimum necessary standard does not apply to disclosures to, or requests by, a healthcare provider for treatment, although HIPAA safeguards still apply.","C":"The minimum necessary standard never applies to payment-related disclosures.","D":"A pharmacy may disclose the patient's information to any caller who claims to be a physician without checking the circumstances."},"correct_answer":"B","explanation":"Disclosures between healthcare providers for treatment purposes are explicitly exempt from HIPAA's minimum necessary standard.","nha_alignment":"K.25 · 2A.2","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":176,"title":"Controlled Substances · DEA Forms","stem":"A DEA-registered pharmacy plans to destroy unwanted controlled substances from its own inventory using an authorized on-site destruction method that renders the drugs non-retrievable. Which DEA form is used to document the destruction?","options":{"A":"DEA Form 41","B":"DEA Form 106","C":"DEA Form 222","D":"DEA Form 224"},"correct_answer":"A","explanation":"DEA Form 41 documents the destruction of controlled substances by a DEA registrant.","nha_alignment":"K.48 · K.54 · 2B.7","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":177,"title":"OTC Safety · Aspirin and Reye Syndrome","stem":"A caregiver asks a pharmacy technician whether aspirin 325 mg tablets are appropriate for a 13-year-old who currently has influenza-like symptoms. What is the safest response?","options":{"A":"Recommend the adult aspirin dose because the child is older than 12.","B":"Recommend taking aspirin with food to eliminate the main safety concern.","C":"Do not recommend aspirin; refer the caregiver to the pharmacist because aspirin use in children or teenagers with viral illness is associated with Reye syndrome.","D":"Suggest crushing the aspirin into juice to make it safer for the child."},"correct_answer":"C","explanation":"Aspirin use in children or teens with viral illnesses (flu, chickenpox) is linked to Reye syndrome; refer to the pharmacist.","nha_alignment":"K.65 · K.70 · 3A.5","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":178,"title":"Drug Supply Chain · DSCSA Product Identifier","stem":"Under the federal Drug Supply Chain Security Act (DSCSA), which group of data elements makes up the required product identifier for an applicable prescription drug package?","options":{"A":"Prescription number, patient name, days' supply and dispensing date","B":"Prescriber NPI, DEA registration number, patient ZIP code and copay","C":"Manufacturer telephone number, wholesaler account number, pharmacy license number and acquisition cost","D":"National Drug Code (NDC), unique serial number, lot number and expiration date"},"correct_answer":"D","explanation":"DSCSA Product Identifiers consist of: (1) NDC, (2) Unique Serial Number, (3) Lot Number, and (4) Expiration Date.","nha_alignment":"K.33 · 2A.1","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":179,"title":"Federal Law · Emergency Schedule II Prescription","stem":"Under federal DEA regulations, a prescriber directly gives a pharmacist oral authorization for a Schedule II medication during a bona fide emergency meeting federal criteria. Which statement describes the permitted procedure?","options":{"A":"A pharmacy technician may independently authorize an emergency refill of the Schedule II prescription.","B":"The pharmacist may dispense only the amount needed for the emergency, promptly document the oral order, and ensure the required prescriber follow-up prescription is furnished within seven days.","C":"The pharmacist may dispense an unrestricted 90-day quantity without further documentation.","D":"Federal law prohibits all emergency oral Schedule II prescriptions without exception."},"correct_answer":"B","explanation":"Under 21 CFR § 1306.11(d), an emergency oral C-II order requires dispensing only the emergency amount and obtaining a written/electronic follow-up within 7 days.","nha_alignment":"K.46 · K.50 · 2B.4","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":180,"title":"PHRA 1009 · Temperature Conversion","stem":"A thermometer displays 104°F. What is the equivalent temperature in degrees Celsius?","options":{"A":"32°C","B":"36°C","C":"40°C","D":"45°C"},"correct_answer":"C","explanation":"°C = (°F - 32) × 5/9 = (104 - 32) × 5/9 = 72 × 5/9 = 40°C. [CURRICULUM HOLD FOR PHRA 1009: Temperature Math]","nha_alignment":"K.121 · 4C.6","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":181,"title":"Cardiovascular · Heart Failure","stem":"A pharmacy receives a prescription for Entresto for a patient with chronic heart failure. Which two active ingredients are contained in this medication?","options":{"A":"Losartan and hydrochlorothiazide","B":"Lisinopril and amlodipine","C":"Carvedilol and spironolactone","D":"Sacubitril and valsartan"},"correct_answer":"D","explanation":"Entresto combines sacubitril (neprilysin inhibitor) and valsartan (ARB) into an ARNI class agent. [CURRICULUM HOLD: Heart Failure Module]","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":182,"title":"Endocrine · Diabetes Medication Classes","stem":"A prescription for Actos (pioglitazone) is received for an adult with type 2 diabetes. Which therapeutic drug class correctly identifies pioglitazone?","options":{"A":"Thiazolidinedione (TZD)","B":"Sulfonylurea","C":"Biguanide","D":"DPP-4 inhibitor"},"correct_answer":"A","explanation":"Pioglitazone is a TZD that increases insulin sensitivity; carries a Boxed Warning for congestive heart failure.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classr ,"D":"Immediately alert the pharmacist for urgent evaluation and coordination with the prescriber before releasing the medication."},"correct_answer":"D","explanation":"ACE inhibitors carry an FDA Boxed Warning for fetal toxicity and must be discontinued as soon as pregnancy is detected.","nha_alignment":"K.145 · K.149 · 5D","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":186,"title":"OTC and Supplements · Drug Interactions","stem":"A patient taking an oral hormonal contraceptive tells a pharmacy technician that she has started using an herbal product containing St. John's wort. Which action is most appropriate?","options":{"A":"Refer the patient to the pharmacist because St. John's wort may reduce the effectiveness of some hormonal contraceptives.","B":"Explain that herbal supplements cannot interact with prescription medications.","C":"Tell the patient to double the contraceptive dose to compensate.","D":"Remove the contraceptive from the patient's medication profile."},"correct_answer":"A","explanation":"St. John's wort induces CYP3A4 enzymes, reducing serum levels and efficacy of oral contraceptives. Refer to pharmacist.","nha_alignment":"K.71 · K.106 · 3B.3","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":187,"title":"Federal Law · OBRA 1990","stem":"A pharmacy technician studying federal law learns that Medicaid outpatient pharmacy programs have requirements for prospective drug utilization review (DUR) and standards for pharmacist counseling. Which federal law established this framework?","options":{"A":"Durham-Humphrey Amendment of 1951","B":"Controlled Substances Act of 1970","C":"Omnibus Budget Reconciliation Act of 1990 (OBRA '90)","D":"Combat Methamphetamine Epidemic Act of 2005"},"correct_answer":"C","explanation":"OBRA '90 mandated prospective r_classroom":true,"after_answer_texas_note":null},{"id":190,"title":"PHRA 1009 · Dilution and Concentration","stem":"A compounding exercise requires 80 mL of a 5% w/v solution prepared from a compatible 20% w/v stock solution of the same medication. Using C1V1 = C2V2, how much of the 20% stock is required before adding diluent to the final volume?","options":{"A":"20 mL","B":"5 mL","C":"40 mL","D":"60 mL"},"correct_answer":"A","explanation":"C₁V₁ = C₂V₂ and SC × SV = DC × DV. STOCK/HAVE: SC = C₁ = 20%; SV = V₁ is unknown. DESIRED/WANT: DC = C₂ = 5%; DV = V₂ = 80 mL final. SV = (DC × DV)/SC = (5 × 80 mL)/20 = 20 mL of stock. Add diluent q.s. to a final volume of 80 mL. In an introductory arithmetic exercise, 80 − 20 = 60 mL represents the nominal difference, but actual compounded volume should be q.s. to final volume.","nha_alignment":"K.118 · Domain 4C · dilution/concentration","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":191,"title":"Cardiovascular · Diuretic Classification","stem":"A pharmacy receives a prescription for Microzide (hydrochlorothiazide) 12.5 mg capsules for hypertension. Which therapeutic drug class correctly identifies hydrochlorothiazide?","options":{"A":"Loop diuretic","B":"Thiazide diuretic","C":"Potassium-sparing diuretic","D":"Beta-adrenergic blocker"},"correct_answer":"B","explanation":"Hydrochlorothiazide (Microzide) is a thiazide diuretic that inhibits sodium reabsorption in the distal convoluted tubule.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":192,"title":"Respiratory · Combination Inhalers","stem":"A technician receives a prescription for Anoro Ellipta, a maintenance inhaler used for chronic obstructive pulmonary disease (COPD). Which two active medications does it contain?","options":{"A":"Fluticasone propionate and salmeterol","B":"Budesonide and formoterol","C":"Umeclidinium and vilanterol","D":"Tiotropium and olodaterol"},"correct_answer":"C","explanation":"Anoro Ellipta contains umeclidinium (LAMA) and vilanterol (LABA) for COPD maintenance therapy.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":193,"title":"Anti-Infectives · Oral Candidiasis","stem":"A patient receives nystatin oral suspension for oral candidiasis (thrush). Which therapeutic class correctly describes nystatin?","options":{"A":"Polyene antifungal","B":"Macrolide antibiotic","C":"Local anesthetic","D":"Antiviral nucleoside analogue"},"correct_answer":"A","explanation":"Nystatin is a polyene antifungal active against Candida species in the oral cavity.","nha_alignment":"K.57 · K.61","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":194,"title":"Medication Storage · Original Packaging","stem":"While preparing a prescription for Pradaxa (dabigatran etexilate) capsules, a technician considers transferring the capsules from the manufacturer's bottle into a standard pharmacy vial. What is the appropriate action?","options":{"A":"Transfer the capsules because all oral capsules are stable in ordinary prescription vials.","B":"Open the capsules and place the contents in individual dose packets.","C":"Refrigerate the loose capsules after repackaging them.","D":"Keep the capsules in their original bottle or blister packaging and follow the manufacturer's moisture-protection instructions."},"correct_answer":"D","explanation":"Pradaxa capsules are moisture-sensitive and must remain in original packaging; must be used within 4 months of opening.","nha_alignment":"K.14 · K.93 · 1K · 4B.3","game_cat ion":"A valved holding chamber (spacer) helps pMDI users overcome actuation-inhalation coordination difficulties.","nha_alignment":"K.8 · 1E","game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":198,"title":"Federal Law · Controlled-Substance Inventory","stem":"A DEA-registered community pharmacy is conducting a required federal controlled-substance inventory. A previously opened stock bottle contains a Schedule II medication. What counting method is required for that opened container under 21 CFR §1304.11?","options":{"A":"Estimate the number of tablets based on the bottle's weight.","B":"Use the quantity shown on the last wholesale invoice without counting.","C":"Count only the tablets expected to be dispensed that day.","D":"Make an exact count of the tablets remaining in the opened container."},"correct_answer":"D","explanation":"21 CFR § 1304.11 mandates an exact count or measure for opened Schedule I and II commercial containers.","nha_alignment":"K.54 · 2B.7","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":199,"title":"Nonsterile Compounding · Levigation","stem":"A technician is preparing a nonsterile ointment under the pharmacist's supervision. An insoluble, finely powdered drug must be incorporated evenly into the ointment base. Which technique uses a small amount of a suitable liquid to wet and smooth the powder before incorporation?","options":{"A":"Terminal sterilization","B":"Lyophilization","C":"Levigation","D":"Filtration through a sterilizing membrane"},"correct_answer":"C","explanation":"Levigation uses a levigating liquid to wet insoluble powder into a smooth paste prior to incorporation into an ointment base. [CURRICULUM HOLD: Nonsterile Compounding]","nha_alignment":"K.131 · 4D.8","game_category":"PHARMACY PRACTICE","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":200,"title":"PHRA 1009 · Ratio Strength","stem":"A pharmacy mathematics exercise describes a 1:5,000 w/v solution, meaning 1 gram of medication in 5,000 mL of final solution. What is the concentration in mg/mL?","options":{"A":"0.2 mg/mL","B":"2 mg/mL","C":"0.02 mg/mL","D":"5 mg/mL"},"correct_answer":"A","explanation":"1:5,000 w/v = 1 g / 5,000 mL = 1,000 mg / 5,000 mL = 0.2 mg/mL. [CURRICULUM HOLD FOR PHRA 1009: Ratio Strength]","nha_alignment":"K.116 · 4C.5","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 or topic-specific teaching required","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":201,"title":"Cardiovascular · Statins","stem":"A pharmacy receives a prescription for Crestor (rosuvastatin) to treat elevated LDL cholesterol. Which therapeutic class correctly identifies this medication?","options":{"A":"Bile acid sequestrant","B":"PCSK9 inhibitor","C":"HMG-CoA reductase inhibitor (statin)","D":"Intestinal cholesterol absorption inhibitor"},"correct_answer":"C","explanation":"Rosuvastatin (Crestor) is an HMG-CoA reductase inhibitor (statin) that reduces hepatic cholesterol synthesis.","nha_alignment":"K.57 · K.61 · K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":202,"title":"Neurology · Neurontin Indication","stem":"A technician receives a prescription for Neurontin (gabapentin). Which condition is an FDA-approved indication for this medication in adults?","options":{"A":"Postherpetic neuralgia, or nerve pain following shingles","B":"Immediate antiviral treatment of an active shingles infection","C":"Acute relief of a migraine attack","D":"Bacterial pharyngitis"},"correct_answer":"A","explanation":"Gabapentin (Neurontin) is approved for postherpetic neuralg const safe=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let all=[],pool=[],boards=[],active=null,revealed=false,used=new Set(),scores=[0,0,0,0],round=0,seconds=30,interval=null,focusBefore=null;
function allowed(){const mode=$('pool').value;if(mode==='mathcurrent'){const set=new Set([1,9,36,56,70,97,115,139,144,180,190,200]);return all.filter(q=>set.has(q.id))}if(mode==='math')return all.filter(q=>q.game_category==='CALCULATIONS');return all.filter(q=>mode==='all'||(q.ready_for_classroom&&(mode!=='ready'||!q.curriculum_hold)))}
function distribute(pool){let p=[...pool].sort((a,b)=>((a.id*7919)%9973)-((b.id*7919)%9973));let result=[];for(let k=0;k<p.length;k+=30)result.push(p.slice(k,k+30));return result.length?result:[[]]}
function chooseGroups(questions){const groups=Array.from({length:6},()=>[]);const buckets=Array.from({length:6},()=>[]);for(const q of questions){const g=q.game_category||'',id=q.id;let col;if(g==='PATIENT SAFETY')col=4;else if(g==='LAW & REGULATIONS')col=5;else if(g==='PHARMACY PRACTICE')col=3;else if(g==='CALCULATIONS')col=0;else col=(id%3===0?2:1);buckets[col].push(q)}
 for(let i=0;i<6;i++){while(groups[i].length<5&&buckets[i].length)groups[i].push(buckets[i].shift())}
 let surplus=buckets.flat();for(let i=0;i<6;i++){while(groups[i].length<5&&surplus.length)groups[i].push(surplus.shift())}return groups}
function updateTabs(){const tabbox=$('week-tabs');tabbox.replaceChildren();for(let i=0;i<7;i++){const b=document.createElement('button');b.className='week-tab'+(i===round?' active':'');b.textContent=i===6?'Championship':'Week '+(i+1);b.disabled=!(boards[i]&&boards[i].length);b.setAttribute('aria-pressed',String(i===round));b.addEventListener('click',()=>{round=i;store('ma-round',round);renderBoard()});tabbox.append(b)}}
function updateStatus(){const mode=$('pool').value;const draft=pool.some(q=>q.editorial_state==='RECONSTRUCTED');let text=`${pool.length} practice questions · ${boards.length} available review board${boards.length!==1?'s':''} · Weekly tabs are board slots, not verified lesson-week assignments.`;if(draft)text+=' Reconstructed wording requires final review.';else if(mode==='ready')text+=' Marked teaching holds excluded.';else text+=' Check prerequisites before playing.';$('info').replaceChildren();const sp=document.createElement('strong');sp.textContent=draft?'EDITORIAL MODE':'CLASSROOM MODE';$('info').append(sp,document.createTextNode('  '+text));$('info').classList.toggle('draft',draft)}
function newBoards(reset=true){pool=allowed();boards=distribute(pool);round=0;if(reset){used=new Set();store('ma-used',[]);store('ma-round',round);store('ma-pool',$('pool').value)}updateStatus();renderBoard()}
function renderBoard(){if(round>=boards.length)round=0;const q=boards[round]||[],groups=chooseGroups(q);$('board').replaceChildren();groups.forEach((g,i)=>{const col=document.createElement('div');col.className='column';const head=document.createElement('div');head.className='category';const glyph=document.createElement('div');glyph.className='cat-glyph';glyph.innerHTML=columns[i][2];const main=document.createElement('div');main.className='cat-main';main.textContent=columns[i][0];const sub=document.createElement('div');sub.className='cat-sub';sub.textContent=columns[i][1];head.append(glyph,main,sub);col.append(head);for(let r=0;r<5;r++){const item=g[r];const btn=document.createElement('button');btn.className='tile';if(!item){btn.className+=' empty';btn.textContent='·';btn.disabled=true}else{btn.className+=used.has(item.id)?' done':'';btn.textContent=String((r+1)*100);btn.disabled=used.has(item.id);btn.setAttribute('aria-label',`${columns[i][0]} ${btn.textContent} points, question ${item.id}`);btn.addEventListener('click',()=>openQ(item,(r+1)*100))}col.append(btn)}$('board').append(col)});$('progress').textContent=`${q.filter(x=>used.has(x.id)).length} / ${q.length} answered`;updateTabs()}
function renderScores(){const n=Number($('teamcount').value),s=$('scores');s.replaceChildren();for(let i=0;i<4;i++){if(i===2)s.append(createTimer());const g=guilds[i],div=document.createElement('div');div.className='guild'+(i>=n?' inactive':'');div.style.setProperty('--guild-color',g.c);const head=document.createElement('div');head.className='guild-head';const mark=document.createElement('span');mark.className='guild-mark';mark.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${g.icon}</svg>`;const name=document.createElement('div');name.className='guild-name';name.textContent=g.name;head.append(mark,name);const count=document.createElement('div');count.className='guild-points';count.textContent=scores[i].toLocaleString();const hint=document.createElement('div');hint.className='guild-hint';hint.textContent=i>=n?'Not competing':'Guild score';div.append(head,count,hint);s.append(div)}}
function createTimer(){const t=document.createElement('div');t.className='timer-crest';t.innerHTML='<div class="timer-ring"><div class="main-clock" id="mainclock">0:30</div><div class="timer-caption">TIME REMAINING</div></div><div class="timer-actions"><button id="mainTimerStart" title="Start or pause timer">▶</button><button id="mainTimerReset" title="Reset timer">↺</button></div>';
t.querySelector('#mainTimerStart').addEventListener('click',toggleClock);t.querySelector('#mainTimerReset').addEventListener('click',resetClock);return t}
function clockTxt(){return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function updateClock(){for(const id of ['clock','mainclock']){const e=$(id);if(e){e.textContent=clockTxt();e.classList.toggle('low',seconds<=10)}}}
function stopClock(){if(interval!==null)clearInterval(interval);interval=null;$('timerStart').textContent='▶ Start timer';const b=$('mainTimerStart');if(b)b.textContent='▶'}
function resetClock(){stopClock();seconds=Number($('secs').value)||30;updateClock()}
function toggleClock(){if(interval!==null){stopClock();return}if(seconds<=0)resetClock();$('timerStart').textContent='Ⅱ Pause';const b=$('mainTimerStart');if(b)b.textContent='Ⅱ';interval=setInterval(()=>{seconds=Math.max(0,seconds-1);updateClock();if(seconds===0)stopClock()},1000)}
function openQ(q,points){focusBefore=document.activeElement;active={q,points};revealed=false;resetClock();$('qmeta').textContent=`QUESTION ${String(q.id).padStart(3,'0')} · ${q.game_category} · ${points} POINTS`;$('questionText').textContent=q.stem;$('answers').replaceChildren();for(const key of letters){const el=document.createElement('div');el.className='answer';el.dataset.letter=key;const b=document.createElement('b');b.textContent=key+'.';const sp=document.createElement('span');sp.textContent=q.options[key];el.append(b,sp);$('answers').append(el)}$('explanation').hidden=true;$('reveal').disabled=false;$('overlay').classList.add('show');$('reveal').focus()}
function finishQ(withMark=true){stopClock();if(withMark&&active){used.add(active.q.id);store('ma-used',[...used]);renderBoard()}$('overlay').classList.remove('show');active=null;revealed=false;if(focusBefore?.focus)focusBefore.focus()}
function reveal(){if(!active||revealed)return;revealed=true;const {q,points}=active;$('explanation').hidden=false;$('reveal').disabled=true;stopClock();document.querySelectorAll('.answer').forEach(el=>el.classList.add(el.dataset.letter===q.correct_answer?'correct':'dim'));
 $('correctbox').textContent=`✓ Correct answer: ${q.correct_answer}. ${q.options[q.correct_answer]}`;$('rationale').textContent=(q.explanation||'').replace(/\[CURRICULUM HOLD[^\]]*\]/gi,'').trim();const notes=[];if(q.after_answer_texas_note)notes.push('TEXAS LAW NOTE: '+q.after_answer_texas_note);if(q.curriculum_hold)notes.push('TEACHING HOLD: '+q.curriculum_hold);if(q.editorial_state==='RECONSTRUCTED')notes.push('INSTRUCTOR DRAFT: Reconstructed question wording, pending final editorial approval.');$('teachnote').hidden=!notes.length;$('teachnote').textContent=notes.join('\n');const aw=$('awards');aw.replaceChildren();for(let i=0;i<Number($('teamcount').value);i++){for(const sign of [1,-1]){const btn=document.createElement('button');btn.textContent=`${sign>0?'+':'−'}${points} · ${guilds[i].name}`;btn.addEventListener('click',()=>{scores[i]+=sign*points;store('ma-scores',scores);finishQ(true);renderScores();updateClock()});aw.append(btn)}}const no=document.createElement('button');no.textContent='No points · close';no.addEventListener('click',()=>finishQ(true));aw.append(no)}
$('reveal').addEventListener('click',reveal);$('close').addEventListener('click',()=>finishQ(revealed));$('timerStart').addEventListener('click',toggleClock);$('timerReset').addEventListener('click',resetClock);$('secs').addEventListener('change',resetClock);$('pool').addEventListener('change',()=>newBoards(true));$('teamcount').addEventListener('change',()=>{store('ma-teamcount',Number($('teamcount').value));renderScores();updateClock()});$('resetBoard').addEventListener('click',()=>{if(!confirm('Start a new game? This clears answered tiles and all guild scores.'))return;used=new Set();scores=[0,0,0,0];round=0;store('ma-scores',scores);store('ma-used',[]);store('ma-round',0);renderBoard();renderScores();resetClock()});$('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()});document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('show'))return;if(e.key==='Escape')finishQ(revealed);else if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();reveal()}});
try{all=JSON.parse($('bank').textContent).questions;if(all.length!==210||new Set(all.map(q=>q.id)).size!==210)throw Error('Expected exactly 210 distinct question records');for(const q of all)if(!q.options?.[q.correct_answer]||!q.stem)throw Error('Incomplete question '+q.id);scores=safe('ma-scores',[0,0,0,0]);if(!Array.isArray(scores)||scores.length!==4)scores=[0,0,0,0];const n=safe('ma-teamcount',4);$('teamcount').value=String([2,3,4].includes(n)?n:4);const m=safe('ma-pool','ready');if([...$('pool').options].some(o=>o.value===m))$('pool').value=m;newBoards(false);let selected=safe('ma-round',0),u=safe('ma-used',[]);if(selected>=0&&selected<boards.length)round=selected;used=new Set(Array.isArray(u)?u:[]);renderBoard();renderScores();resetClock()}catch(e){$('info').textContent='Game loading error: '+e.message;console.error(e)}
})();
</script></body></html>
