.hero,.week-tabs,.tools,.meta-row,.board,.scorebar,.footer{grid-column:2;min-width:0}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-shadow:0 3px 12px #000b}
.moon{height:17px;font-size:19px;line-height:16px;color:var(--gold2);letter-spacing:17px;padding-left:17px}.hero-prefix{font-size:clamp(11px,1.15vw,17px);letter-spacing:.48em;color:#efdfc3;line-height:1.1;margin-top:3px;padding-left:.5em}
.hero-title{margin:0;color:#f5eee2;font-weight:500;font-size:clamp(28px,3.6vw,60px);line-height:1.02;letter-spacing:.065em;font-variant:small-caps;white-space:nowrap}.motto{color:var(--gold2);font-size:clamp(11px,1.3vw,20px);letter-spacing:.2em;line-height:1.15}.translation{color:#d4d6d8;font-size:clamp(10px,1.1vw,15px);font-style:italic;letter-spacing:.08em;margin-top:3px}
.week-tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:0 2.7%;}.week-tab{background:rgba(4,10,17,.89);color:#f2ebdf;border:1px solid #ad987665;border-radius:7px;font-size:clamp(10px,1.08vw,16px);min-width:0;white-space:nowrap;box-shadow:inset 0 1px #cfc3ae13}.week-tab.active{color:#fff6e4;background:linear-gradient(180deg,#353237e8,#101720);border-color:#ead8b3;box-shadow:0 0 0 1px #e3cb9c77,0 0 15px #e0c69e39}.week-tab:not(:disabled):hover{border-color:#efd6a8;background:#273140}.week-tab:disabled{color:#777e86;opacity:.52}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:0}.tools label{font:600 clamp(9px,.76vw,12px) system-ui;color:#d1d5d8;letter-spacing:.04em}.tools select,.tools button{background:#0b1521ea;border:1px solid #978a7a77;border-radius:6px;color:var(--ivory);height:31px;font:11px system-ui;padding:0 9px;max-width:310px}.tools button:hover{background:#26323a}.tools .reset{margin-left:3px}.tools .spacer{flex:1}.tools .label-mini{font:10px system-ui;color:#d5d9d8}.tools .select-group{display:flex;gap:6px;align-items:center}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#e1dfd5;text-shadow:0 1px 4px #000}.meta-row .info{font:10px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta-row .info strong{font-weight:700;color:#e8dab5}.meta-row .info.draft strong{color:#efbf9a}.board-progress{font:11px system-ui;color:#c7cbd2;white-space:nowrap}
.board{height:100%;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:5px;background:#02070fce;border:1px solid #b99f75;border-radius:12px;box-shadow:0 12px 35px #0007,0 0 0 2px #0b141deb,inset 0 0 0 1px #dbc59933}
.column{display:grid;grid-template-rows:minmax(58px,1.18fr) repeat(5,minmax(0,1fr));gap:4px;min-height:0;min-width:0}.category,.tile{border-radius:4px;min-width:0;overflow:hidden}.category{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:linear-gradient(125deg,rgba(23,32,38,.98),rgba(7,12,18,.96));border:1px solid #978a78b5;box-shadow:inset 0 0 0 1px #b5ae8b17;color:var(--ivory);padding:3px}.cat-glyph{height:21px;color:#d8c7a6;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,1.4vw,20px)}.cat-main{font-size:clamp(9px,.93vw,15px);letter-spacing:.06em;font-weight:bold;text-transform:uppercase;white-space:nowrap}.cat-sub{font-size:clamp(7px,.74vw,11px);color:#c6c6c7;white-space:nowrap}
.tile{border:1px solid #9b8c73ab;background:linear-gradient(140deg,rgba(30,39,47,.94),rgba(10,16,22,.96) 78%);color:#eee1c4;font:500 clamp(18px,2.2vw,37px) Georgia;box-shadow:inset 0 1px #ffffff13,0 2px 2px #0009}.tile:not(:disabled):hover{background:linear-gradient(150deg,#424d54,#222d35);border-color:#ecd7a6}.tile.done{color:#747c82;background:rgba(10,16,22,.86);border-color:#56616a80;text-decoration:line-through}.tile.empty{background:rgba(4,7,13,.86);border-color:#2c3843;color:#40484b}
.scorebar{display:grid;grid-template-columns:1fr 1fr minmax(105px,12%) 1fr 1fr;gap:6px;align-items:stretch;min-height:0;padding:0 1px}.guild{background:linear-gradient(145deg,rgba(17,27,36,.94),rgba(6,12,20,.96));border:1px solid #a99573a8;border-radius:7px;min-width:0;padding:8px 4px 5px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;box-shadow:inset 0 1px #eee8cb1a}.guild:before{content:'';position:absolute;top:0;left:14%;right:14%;height:1px;background:var(--guild-color);opacity:.9}.guild.inactive{opacity:.45}.guild-head{display:flex;align-items:center;gap:5px;justify-content:center;white-space:nowrap;min-width:0}.guild-mark{width:23px;height:25px;display:inline-flex;align-items:center;justify-content:center;color:var(--guild-color);font-size:23px}.guild-mark svg{height:23px;width:23px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}.guild-name{font:700 clamp(9px,.9vw,15px) Georgia;letter-spacing:.07em;color:#f0e9dc;font-variant:small-caps;white-space:nowrap}.guild-points{font:500 clamp(24px,2vw,38px) Georgia;color:#eee5d5;font-variant-numeric:tabular-nums;line-height:1.12}.guild-hint{font:9px system-ui;color:#bcc4cb}.timer-crest{display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;color:var(--ivory)}.timer-ring{width:clamp(76px,6.2vw,110px);height:clamp(76px,6.2vw,110px);max-height:100%;border:2px double #e2c89f;border-radius:50%;box-shadow:inset 0 0 0 5px #0b1423,inset 0 0 0 6px #897b67,0 0 0 4px #927c566e;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070f19ef}.main-clock{font:400 clamp(23px,2.1vw,37px) Georgia;color:#f4e8d2;font-variant-numeric:tabular-nums}.timer-caption{font:8px system-ui;letter-spacing:.075em;color:#dbcaaf;white-space:nowrap}.timer-actions{position:absolute;bottom:-2px;display:flex;gap:2px}.timer-actions button{font:9px system-ui;color:#edd7b2;background:#0b1723;opacity:.95;border:1px solid #9c8a6b;border-radius:4px;padding:2px 5px}.timer-actions button:hover{color:white;background:#243341}
.footer{font:9px system-ui;text-align:center;color:#ced0d2;text-shadow:0 1px 6px #020510;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:#020611ed;backdrop-filter:blur(10px)}.overlay.show{display:flex}.modal{width:min(1000px,98vw);max-height:95dvh;overflow:auto;position:relative;background:linear-gradient(135deg,#1b2832,#0d1722 66%,#151b25);border:1px solid #d0bc98;border-radius:13px;padding:clamp(15px,2vw,33px);box-shadow:0 20px 80px #000d,inset 0 0 0 1px #fff2d613}.modal-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.qmeta{font:700 12px system-ui;letter-spacing:.1em;color:#e2c99c;text-transform:uppercase}.close{font:12px system-ui;color:var(--ivory);background:#172636;border:1px solid #998774;border-radius:5px;padding:9px 12px}.question{font-size:clamp(23px,2.65vw,37px);line-height:1.28;margin:22px 0;color:#f9f5ec}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{font:clamp(15px,1.3vw,20px) system-ui;display:flex;align-items:center;gap:10px;min-height:75px;border:1px solid #62737e;background:#13212f;padding:13px;color:#f0f1ee;border-radius:6px}.answer b{font:700 22px Georgia;color:#dcc399}.answer.correct{background:#203b35;border-color:#9dc5a9}.answer.dim{opacity:.45}.modal-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid #94877777;padding-top:13px;margin-top:16px}.modal-controls button,.awards button{background:#152533;color:#f3f0e7;border:1px solid #a5967c;border-radius:5px;padding:11px 13px;font:600 13px system-ui}.modal-controls button:hover,.awards button:hover{background:#314353}.modal-controls .primary{background:#d0bc94;color:#07121e;border-color:#f5e4bf;font-weight:800}.clock{font:30px Georgia;color:#f6e9cd;margin-left:6px;font-variant-numeric:tabular-nums}.clock.low,.main-clock.low{color:#ffc0b3}.duration{margin-left:auto;display:flex;align-items:center;gap:7px;font:12px system-ui}.duration select{color:var(--ivory);background:#162435;border:1px solid #978d80;border-radius:5px;padding:6px}.explanation{font-size:16px;line-height:1.45;margin-top:14px;border-top:1px solid #8d83766a;padding-top:13px}.correctbox{font-size:20px;color:#d4f1dd;margin-bottom:8px}.teachnote{white-space:pre-line;color:#f1debb;background:#3c352c;border:1px solid #9a856a;border-radius:5px;padding:8px;margin-top:10px;font:12px system-ui}.awards{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.awards button{font-size:12px;padding:9px}.legend{font:10px system-ui;color:#c1c8ce;margin-left:auto}

@media(max-width:560px){.week-tabs{overflow-x:auto;display:flex;min-height:34px}.week-tab{min-width:82px}.board{overflow-x:auto;min-height:400px;grid-template-columns:repeat(6,minmax(106px,1fr))}.scorebar{display:grid;grid-template-columns:repeat(2,1fr);height:auto;gap:5px}.guild{height:62px}.timer-crest{grid-column:span 2;grid-row:1;height:77px}.guild-head{flex-direction:row}.guild-points{font-size:23px}.app{padding:7px}.tools label{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

dy_for_classroom":true,"after_answer_texas_note":null},{"id":4,"title":"Endocrine · Drug class","stem":"A prescription for metformin is entered for a patient with type 2 diabetes. Which drug class should the technician associate with metformin?","options":{"A":"Sulfonylurea","B":"DPP-4 inhibitor","C":"SGLT2 inhibitor","D":"Biguanide"},"correct_answer":"D","explanation":"Metformin is a biguanide. Glipizide is a sulfonylurea; sitagliptin a DPP-4 inhibitor; empagliflozin an SGLT2 inhibitor.","nha_alignment":"Domain 3A, K.57, K.61, K.62","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":5,"title":"Reproductive · Different levonorgestrel products","stem":"Two products, Plan B One-Step and Mirena, both contain levonorgestrel. Which statement most accurately distinguishes them?","options":{"A":"Both are oral products used in the same dosing regimen.","B":"Plan B One-Step is an oral emergency contraceptive; Mirena is an intrauterine contraceptive system.","C":"Mirena is an oral emergency contraceptive; Plan B One-Step is an intrauterine system.","D":"Both use the same dosage form but have different brand names."},"correct_answer":"B","explanation":"These products share an ingredient but differ in dosage form, route, regimen, and intended use. Patient-specific product advice goes to the pharmacist.","nha_alignment":"Domain 3A/3B, K.59, K.60, K.68","game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"Reproductive mini-lesson","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":6,"title":"Controlled substances · DEA checksum","stem":"A *fictional* DEA registration example is written as AB123456?. Using the standard mathematical checksum calculation for the six digits, which check digit is expected?","options":{"A":"1","B":"2","C":"3","D":"8"},"correct_answer":"C","explanation":"(1 + 3 + 5) + 2(2 + 4 + 6) = 9 + 24 = 33. The final digit is 3. Checksum success alone is not proof of a valid registration.","nha_alignment":"Domain 2B, K.47","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":"DEA checksum skill taught","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":7,"title":"Patient privacy · Unverified family caller","stem":"An unverified caller says she is a patient's adult daughter and asks for the patient's medication list because the patient is in the emergency department. What is the technician's best **initial** action?","options":{"A":"Read the list because a family relationship was claimed.","B":"Read only the names of controlled substances.","C":"Do not disclose immediately; follow verification procedures and refer the request to the pharmacist.","D":"Send the list to any number the caller provides."},"correct_answer":"C","explanation":"The technician should not disclose protected health information to an unverified caller. HIPAA permits some disclosures to family members involved in a patient's care under specified circumstances, including when the patient is incapacitated. The technician must follow established pharmacy identity-verification/privacy procedures and refer the request to the pharmacist, who can determine what may lawfully be disclosed.","nha_alignment":"Domain 2A, K.25","game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":8,"title":"Pharmacy business calculations · Markup","stem":"A pharmacy purchases an item for $30 and sells it for $40. What is the percentage **markup based on acquisition cost**, rounded to the nearest tenth of a percent?","options":{"A":"25.0%","B":"30.0%","C":"33.3%","D":"40.0%"},"correct_answer":"C","explanation":"($40 − $30) ÷ $30 × 100 = 33.3%. Gross margin on selling price would instead be 25%.","nha_alignment":"Domain 4C, K.122","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 business calculations","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":9,"title":"Bottle packaging · Specified conversion","stem":"A liquid prescription requires 150 mL. **For this question, use the pharmacy-class approximation 1 fl oz = 30 mL.** How many 1-fl-oz bottles are needed?","options":{"A":"4 bottles","B":"5 bottles","C":"6 bottles","D":"7 bottles"},"correct_answer":"B","explanation":"150 mL ÷ (30 mL/bottle) = 5 bottles. For actual bottle capacities based on an exact U.S. fluid ounce, the result differs; the problem must specify its convention.","nha_alignment":"Domain 4C, K.108, K.115","game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 conversions","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":10,"title":"Sterile compounding · USP standards","stem":"A hospital pharmacy prepares an aseptically compounded sterile medication. Which USP chapter primarily sets standards for sterile compounding?","options":{"A":"USP \u003c795\u003e","B":"USP \u003c800\u003e","C":"USP \u003c797\u003e","D":"USP \u003c825\u003e"},"correct_answer":"C","explanation":"USP \u003c797\u003e addresses sterile compounding, \u003c795\u003e nonsterile compounding, \u003c800\u003e handling hazardous drugs, and \u003c825\u003e radiopharmaceutical preparations.","nha_alignment":"Domain 4D, K.125, K.130","game_category":"PATIENT SAFETY","curriculum_hold":"Sterile compounding overview","editorial_state":"RECOVERED","ready_for_classroom":true,"after_answer_texas_note":null},{"id":11,"title":"Losartan / ARB","stem":"A patient is prescribed Cozaar (losartan). Which drug class describes losartan?","options":{"A":"ACE inhibitor","B":"Angiotensin II receptor blocker (ARB)","C":"Beta-adrenergic blocker","D":"Loop diuretic"},"correct_answer":"B","explanation":"Losartan blocks angiotensin II receptors and belongs to the ARB class; an ARB is not an ACE inhibitor.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":12,"title":"Montelukast / Asthma","stem":"A prescription for Singulair (montelukast) is on file. Which condition is a recognized use of montelukast?","options":{"A":"Immediate reversal of severe bronchospasm","B":"Bacterial pneumonia","C":"Long-term prevention/control of asthma symptoms","D":"Acute hypoglycemia"},"correct_answer":"C","explanation":"Montelukast is a leukotriene receptor antagonist for controller therapy and certain allergic-rhinitis uses; it is not an asthma rescue medication.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":13,"title":"Pantoprazole / PPI","stem":"A patient receives Protonix (pantoprazole). What therapeutic class does this medication belong to?","options":{"A":"H2-receptor antagonist","B":"Proton pump inhibitor","C":"Antacid","D":"Antiemetic"},"correct_answer":"B","explanation":"Pantoprazole reduces gastric acid secretion as a proton pump inhibitor (PPI).","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":14,"title":"Glipizide / Sulfonylurea","stem":"Glucotrol (glipizide) is received at intake. Which drug class should the pharmacy technician recognize?","options":{"A":"Biguanide","B":"SGLT2 inhibitor","C":"GLP-1 receptor agonist","D":"Sulfonylurea"},"correct_answer":"D","explanation":"Glipizide is a sulfonylurea that increases pancreatic insulin secretion.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":15,"title":"Dilantin / Phenytoin","stem":"Which generic medication corresponds to the brand Dilantin?","options":{"A":"Levetiracetam","B":"Lamotrigine","C":"Phenytoin","D":"Gabapentin"},"correct_answer":"C","explanation":"Dilantin is a brand of phenytoin, an anticonvulsant.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1001 neurologic medications","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":16,"title":"Zoloft / Sertraline","stem":"A prescription lists Zoloft. Which generic name is correct?","options":{"A":"Fluoxetine","B":"Paroxetine","C":"Escitalopram","D":"Sertraline"},"correct_answer":"D","explanation":"Zoloft is sertraline, a selective serotonin reuptake inhibitor (SSRI).","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"PHRA 1001 psychiatric medications","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":17,"title":"Macrobid formulation","stem":"A technician is selecting Macrobid 100 mg capsules. Which ingredient/formulation matches this brand?","options":{"A":"Nitrofurantoin monohydrate/macrocrystals","B":"Nitrofurantoin macrocrystals alone (Macrodantin)","C":"Sulfamethoxazole/trimethoprim","D":"Cephalexin monohydrate"},"correct_answer":"A","explanation":"Macrobid contains nitrofurantoin monohydrate/macrocrystals; it is not interchangeable in naming with the macrocrystals-only brand Macrodantin.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":18,"title":"Sprintec ingredients","stem":"The oral contraceptive brand Sprintec combines which two active ingredients?","options":{"A":"Drospirenone and ethinyl estradiol","B":"Norgestimate and ethinyl estradiol","C":"Levonorgestrel alone","D":"Medroxyprogesterone acetate alone"},"correct_answer":"B","explanation":"Sprintec is a combined oral contraceptive containing norgestimate and ethinyl estradiol.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"Reproductive mini-lesson","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":19,"title":"Clobetasol topical potency","stem":"A patient is prescribed clobetasol propionate 0.05% topical cream. Which drug class is correct?","options":{"A":"Very-high-potency topical corticosteroid","B":"Topical antibiotic","C":"Topical antifungal","D":"Local anesthetic"},"correct_answer":"A","explanation":"Clobetasol is a super-high-potency topical corticosteroid; potency and use must follow pharmacist/prescriber directions.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":20,"title":"Cyclobenzaprine indication","stem":"Flexeril (cyclobenzaprine) is most commonly recognized as a medication used for which problem?","options":{"A":"Long-term treatment of bacterial infection","B":"Short-term treatment of acute muscle spasm","C":"Lowering LDL cholesterol","D":"Preventing blood clots"},"correct_answer":"B","explanation":"Cyclobenzaprine is a centrally acting skeletal-muscle relaxant used as an adjunct for acute musculoskeletal muscle spasm.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":21,"title":"Vaccine-induced immunity","stem":"When a person receives a vaccine and develops their own immune response, which type of immunity is produced?","options":{"A":"Naturally acquired passive immunity","B":"Artificially acquired active immunity","C":"Artificially acquired passive immunity","D":"Innate immunity only"},"correct_answer":"B","explanation":"Vaccination stimulates the recipient's own adaptive immune response, an example of artificially acquired active immunity.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":22,"title":"Cetirizine class","stem":"Zyrtec (cetirizine) belongs to which therapeutic class?","options":{"A":"H1 antihistamine","B":"Leukotriene antagonist","C":"Cough suppressant","D":"Systemic corticosteroid"},"correct_answer":"A","explanation":"Cetirizine is a second-generation H1-receptor antihistamine used for allergy symptoms.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":23,"title":"Ophthalmic SIG decoding","stem":"The prescription SIG reads “Instill 1 gtt OU qhs.” Which label direction correctly translates the SIG?","options":{"A":"Instill one drop into the right eye every morning.","B":"Instill one drop into both ears twice daily.","C":"Take one tablet by mouth every night.","D":"Instill one drop into both eyes every night at bedtime."},"correct_answer":"D","explanation":"gtt = drop; OU = both eyes; qhs = every night at bedtime. Write the directions in full on the patient label.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":"SIG decoding taught","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":24,"title":"Otic versus ophthalmic","stem":"An ear-drop prescription is being entered. Which abbreviation denotes the RIGHT EAR rather than the right eye?","options":{"A":"OD","B":"OU","C":"AD","D":"OS"},"correct_answer":"C","explanation":"AD means right ear; OD means right eye. Avoid confusing otic and ophthalmic routes and use clear language on labels.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":25,"title":"LASA mismatch","stem":"A technician sees hydroxyzine on a prescription but hydralazine on the selected stock bottle. What is the best action?","options":{"A":"Dispense hydralazine because the names are similar.","B":"Stop and resolve the look-alike/sound-alike mismatch with the pharmacist.","C":"Select the lower-strength product automatically.","D":"Ignore the mismatch if the bottle size matches."},"correct_answer":"B","explanation":"Hydroxyzine and hydralazine are different drugs. Stop product selection, verify the written order, and escalate to the pharmacist.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":26,"title":"Insulin concentrations","stem":"An order specifies insulin glargine U-300, but the selected product is U-100. What should the technician do?","options":{"A":"Substitute U-100 in the same number of milliliters without review.","B":"Change the prescribed insulin units to three times the amount.","C":"Stop and have the concentration/product verified before proceeding.","D":"Treat both concentrations as the same package."},"correct_answer":"C","explanation":"Insulin glargine U-100 and U-300 have different concentrations and delivery products; they must not be substituted without appropriate authorization and pharmacist verification.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":"Insulin concentration safety","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":27,"title":"FDA Orange Book","stem":"Which FDA reference lists approved drug products with therapeutic equivalence evaluations, including AB ratings?","options":{"A":"Orange Book","B":"Purple Book","C":"Red Book pricing guide","D":"Safety Data Sheet"},"correct_answer":"A","explanation":"The FDA Orange Book contains approved drug products with therapeutic-equivalence evaluations, including AB codes.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":28,"title":"Warfarin and ibuprofen","stem":"A patient taking warfarin asks a technician whether it is safe to start ibuprofen. What is the appropriate response?","options":{"A":"Assure the patient no interaction is possible.","B":"Tell the patient to double the warfarin dose.","C":"Change the warfarin directions in the computer.","D":"Refer to the pharmacist because of a potential bleeding interaction."},"correct_answer":"D","explanation":"Warfarin with NSAIDs such as ibuprofen can increase bleeding risk; the pharmacist must evaluate and counsel.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":29,"title":"CMEA pseudoephedrine","stem":"A customer requests an over-the-counter pseudoephedrine product kept behind the counter. What must staff do under applicable CMEA requirements?","options":{"A":"Sell unlimited quantities because no prescription is needed.","B":"Follow purchaser identity/log and quantity-limit requirements before sale.","C":"Move all pseudoephedrine products to open shelves.","D":"Ignore the transaction log if the customer is a regular."},"correct_answer":"B","explanation":"Federal Combat Methamphetamine Epidemic Act requirements include sale limits, identification and sales-record procedures for covered nonprescription pseudoephedrine products.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":30,"title":"Vaccine cold-chain excursion","stem":"A refrigerator storing vaccines was found outside the recommended temperature range overnight. What should the technician do first?","options":{"A":"Dispense vaccines as usual because the excursion was brief.","B":"Discard every vial without consulting the vaccine coordinator.","C":"Label/segregate affected stock 'DO NOT USE,' notify responsible staff, and follow excursion procedure.","D":"Reset the temperature logger and hide the event."},"correct_answer":"C","explanation":"Potentially exposed vaccines should be secured, marked do not use, and assessed under the vaccine manufacturer/CDC excursion process before release or disposition.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":"Vaccine storage handling","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":31,"title":"Schedule II refills","stem":"Under federal law, how many refills may be dispensed for a Schedule II controlled-substance prescription?","options":{"A":"One refill","B":"Zero refills","C":"Five refills in six months","D":"Unlimited within one year"},"correct_answer":"B","explanation":"Federal law prohibits refills on Schedule II controlled-substance prescriptions.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":32,"title":"Methotrexate safety","stem":"A methotrexate prescription for rheumatoid arthritis unexpectedly says “take daily,” but the patient's previous regimen was weekly. What should the technician do?","options":{"A":"Change it to weekly without discussing the order.","B":"Dispense as written without flagging it.","C":"Hold processing and immediately alert the pharmacist about the possible dosing error.","D":"Advise the patient to take two doses every other day."},"correct_answer":"C","explanation":"Methotrexate for many non-oncology conditions is commonly dosed weekly; mistaken daily dosing can be dangerous and requires pharmacist/prescriber clarification.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":"High-alert methotrexate safety","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":33,"title":"Metoprolol ER versus IR","stem":"Toprol-XL is selected for an order that names Lopressor. Why should the technician stop and verify?","options":{"A":"Toprol-XL is the generic name for verapamil.","B":"Metoprolol succinate extended-release and metoprolol tartrate immediate-release are different formulations.","C":"Lopressor is an over-the-counter product.","D":"These are different brand names for an identical release formulation."},"correct_answer":"B","explanation":"Toprol-XL is metoprolol succinate ER; Lopressor is metoprolol tartrate IR. Product/formulation selection must match the order.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":34,"title":"Tamsulosin","stem":"What therapeutic drug class describes Flomax (tamsulosin) used for benign prostatic hyperplasia?","options":{"A":"Alpha-1 adrenergic blocker","B":"5-alpha-reductase inhibitor","C":"Loop diuretic","D":"Cholinesterase inhibitor"},"correct_answer":"A","explanation":"Tamsulosin is an alpha-1 blocker used to improve urinary flow symptoms in BPH.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":35,"title":"Penicillin allergy / Augmentin","stem":"A patient's allergy profile states anaphylaxis to penicillin and the new order is Augmentin. What is the safest next step?","options":{"A":"Delete the allergy from the profile.","B":"Process without intervention because Augmentin is not a penicillin.","C":"Tell the patient to halve the Augmentin dose.","D":"Hold the order and alert the pharmacist for allergy evaluation."},"correct_answer":"D","explanation":"Augmentin contains amoxicillin (a penicillin) plus clavulanate. A severe penicillin allergy warrants pharmacist assessment before dispensing.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":36,"title":"Oral-liquid days supply","stem":"A liquid prescription provides 150 mL and directs the patient to take 5 mL three times daily. What is the days' supply?","options":{"A":"5 days","B":"10 days","C":"15 days","D":"30 days"},"correct_answer":"B","explanation":"Daily volume is 5 mL × 3 = 15 mL/day; 150 mL ÷ 15 mL/day = 10 days.","nha_alignment":null,"game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 days supply","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":37,"title":"DAW 1","stem":"In the pharmacy claim system, what does DAW 1 generally indicate?","options":{"A":"Patient requested a generic substitution.","B":"Prescriber requires brand-name product; dispense as written.","C":"The product is discontinued.","D":"No substitution preference has been specified."},"correct_answer":"B","explanation":"DAW 1 means the prescriber requires the brand-name product; payer and state substitution rules still apply.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":38,"title":"Refill too soon","stem":"A claim rejects as “Refill Too Soon.” What should the technician do?","options":{"A":"Change the fill date to an earlier date.","B":"Increase the days' supply until the claim pays.","C":"Check the last fill and payer eligibility date, then follow policy or refer to the pharmacist.","D":"Use an unrelated patient's plan."},"correct_answer":"C","explanation":"Refill-too-soon rejections require review of prior fills, days' supply and payer rules; do not falsify claim information.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":39,"title":"Atorvastatin statin","stem":"Lipitor (atorvastatin) is prescribed for high cholesterol. Which therapeutic class is correct?","options":{"A":"Beta-adrenergic blocker","B":"HMG-CoA reductase inhibitor (statin)","C":"Calcium channel blocker","D":"H2-receptor antagonist"},"correct_answer":"B","explanation":"Atorvastatin is an HMG-CoA reductase inhibitor, commonly called a statin.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":40,"title":"NDC segments","stem":"Which statement accurately describes the three segments in a standard 10- or 11-digit NDC?","options":{"A":"They encode patient's DOB, prescriber ID, and refill count.","B":"They identify DEA schedule, pharmacy number, and lot only.","C":"The segments identify labeler, product, and package size/type.","D":"They consist of insurance BIN, PCN, and group."},"correct_answer":"C","explanation":"An NDC has labeler, product, and package code components. Exact display segment lengths vary across configurations.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":41,"title":"Apixaban","stem":"Eliquis (apixaban) belongs to which anticoagulant class?","options":{"A":"Direct thrombin inhibitor","B":"Direct factor Xa inhibitor","C":"Vitamin K antagonist","D":"Unfractionated heparin"},"correct_answer":"B","explanation":"Apixaban is a direct factor Xa inhibitor anticoagulant.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":42,"title":"Alendronate","stem":"Fosamax (alendronate) is used for osteoporosis. What is its therapeutic class?","options":{"A":"Bisphosphonate","B":"Selective serotonin reuptake inhibitor","C":"Beta blocker","D":"Loop diuretic"},"correct_answer":"A","explanation":"Alendronate belongs to the bisphosphonate class used for osteoporosis and other bone disorders.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":43,"title":"Latanoprost","stem":"A technician receives Xalatan eye drops. Which active ingredient is in Xalatan?","options":{"A":"Timolol","B":"Brimonidine","C":"Latanoprost","D":"Dorzolamide"},"correct_answer":"C","explanation":"Xalatan contains latanoprost, a prostaglandin analogue for lowering intraocular pressure.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":44,"title":"Ondansetron","stem":"Zofran (ondansetron) is classified as which antiemetic?","options":{"A":"Dopamine replacement","B":"H2 receptor antagonist","C":"Anticholinesterase inhibitor","D":"5-HT3 receptor antagonist"},"correct_answer":"D","explanation":"Ondansetron is a serotonin 5-HT3 receptor antagonist used to prevent nausea and vomiting.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":45,"title":"Iron-deficiency anemia","stem":"Ferrous sulfate tablets are frequently used to treat what condition?","options":{"A":"Hyperthyroidism","B":"Iron-deficiency anemia","C":"Bacterial infection","D":"Hyperkalemia"},"correct_answer":"B","explanation":"Ferrous sulfate supplies iron for prevention or treatment of iron-deficiency anemia when clinically indicated.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":46,"title":"Z-Pak tablets","stem":"A Z-Pak 250 mg carton contains six tablets and is taken as two tablets on day 1, then one tablet daily on days 2 through 5. How many total tablets are taken?","options":{"A":"5 tablets","B":"8 tablets","C":"6 tablets","D":"10 tablets"},"correct_answer":"C","explanation":"Day 1 uses 2 tablets and days 2–5 use 4 tablets, totaling 6 tablets. Follow the prescription directions and product labeling.","nha_alignment":null,"game_category":"CALCULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":47,"title":"Schedule IV expiration","stem":"A patient brings an eight-month-old Schedule IV prescription with refills remaining. Under federal law, what applies?","options":{"A":"Refill because five refills are allowed regardless of age.","B":"Refill indefinitely if the original bottle remains.","C":"Convert the prescription into a Schedule V order.","D":"Do not refill because more than six months have elapsed since issue."},"correct_answer":"D","explanation":"Federal law limits Schedule III and IV refills to five within six months from prescription issue, whichever limit is reached first.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":48,"title":"Error-prone abbreviations","stem":"Which prescription abbreviation is considered error-prone and should be clarified or written out?","options":{"A":"“U” to mean units","B":"“mg” to mean milligrams","C":"“mL” to mean milliliters","D":"“PO” to mean by mouth"},"correct_answer":"A","explanation":"ISMP warns against using U for units because it can be mistaken for zero or another number. Write out 'units.'","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":49,"title":"USP 800 hazardous drugs","stem":"A technician must handle a hazardous drug for compounding. Which USP chapter primarily addresses occupational handling protections?","options":{"A":"USP \u003c659\u003e","B":"USP \u003c825\u003e only","C":"USP \u003c800\u003e","D":"USP \u003c795\u003e exclusively"},"correct_answer":"C","explanation":"USP \u003c800\u003e addresses handling hazardous drugs in healthcare settings; apply facility-specific controls and applicable standards.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":"USP 800 compounding","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":50,"title":"FDA Medication Guide","stem":"A prescription drug requires an FDA Medication Guide. What should be done when dispensing?","options":{"A":"Substitute an insurance claim printout for the guide.","B":"Provide the applicable Medication Guide to the patient as required, under pharmacy procedures.","C":"Remove it when the prescription is a refill.","D":"Keep the Medication Guide only in the pharmacist's office."},"correct_answer":"B","explanation":"FDA Medication Guides are required for certain drugs when dispensed under applicable regulations; follow the product and dispensing requirements.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":51,"title":"MiraLAX","stem":"A customer asks for MiraLAX (polyethylene glycol 3350). Which laxative class should the technician recognize?","options":{"A":"Stimulant laxative","B":"Osmotic laxative","C":"Bulk-forming laxative","D":"Stool softener"},"correct_answer":"B","explanation":"Polyethylene glycol 3350 is an osmotic laxative that retains water in stool. Refer patient-specific treatment questions to the pharmacist.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":52,"title":"Oxybutynin","stem":"Ditropan XL (oxybutynin) is prescribed for overactive bladder. Which drug class is correct?","options":{"A":"Alpha-1 blocker","B":"5-alpha-reductase inhibitor","C":"Antimuscarinic agent","D":"Loop diuretic"},"correct_answer":"C","explanation":"Oxybutynin is an antimuscarinic agent used for overactive bladder.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":53,"title":"Yasmin","stem":"Which ingredients are in the oral contraceptive brand Yasmin?","options":{"A":"Ethinyl estradiol and norgestimate","B":"Levonorgestrel alone","C":"Etonogestrel alone","D":"Ethinyl estradiol and drospirenone"},"correct_answer":"D","explanation":"Yasmin contains ethinyl estradiol plus drospirenone; identify the exact brand/combination.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"Reproductive mini-lesson","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":54,"title":"Ipratropium","stem":"Atrovent HFA (ipratropium) is used for COPD. Which drug class should be selected?","options":{"A":"Short-acting anticholinergic bronchodilator","B":"Long-acting beta-2 agonist","C":"Inhaled corticosteroid","D":"Oral leukotriene inhibitor"},"correct_answer":"A","explanation":"Ipratropium is a short-acting muscarinic antagonist inhaled bronchodilator.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":55,"title":"DSCSA suspect product","stem":"An incoming prescription product has broken seals and suspect tampering indicators under DSCSA procedures. What is the technician's response?","options":{"A":"Return it directly to available inventory.","B":"Repackage it and dispense first.","C":"Delete the package history and continue.","D":"Quarantine the suspect product and immediately follow pharmacist/DSCSA investigation procedures."},"correct_answer":"D","explanation":"Suspect drugs must be quarantined and investigated through appropriate trading-partner and pharmacist processes before possible release.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":56,"title":"Percent w/v conversion","stem":"A topical solution is labeled 2% w/v. How many milligrams of drug are present in each mL?","options":{"A":"2 mg/mL","B":"200 mg/mL","C":"20 mg/mL","D":"0.2 mg/mL"},"correct_answer":"C","explanation":"2% w/v = 2 g in 100 mL = 2000 mg/100 mL = 20 mg/mL. Circle the surviving mg/mL and box the final answer.","nha_alignment":null,"game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 percent strength","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":57,"title":"Missing patient name","stem":"A handwritten prescription lacks the patient's name. What should the pharmacy technician do?","options":{"A":"Guess the name from the prescriber's prior visits.","B":"Hold intake and obtain verified patient identification through appropriate pharmacy procedures.","C":"Fill under the most recently used profile.","D":"Choose any similar name and correct after dispensing."},"correct_answer":"B","explanation":"Required patient identifiers must be established before an order can be safely entered and dispensed.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":58,"title":"BIN claim routing","stem":"Which third-party billing number primarily identifies the transaction processor for routing an electronic pharmacy claim?","options":{"A":"BIN (Bank Identification Number)","B":"NDC","C":"DEA registration number","D":"NPI"},"correct_answer":"A","explanation":"The claim BIN routes a pharmacy claim to the appropriate processor; PCN and other fields may provide further routing.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":59,"title":"Sterile critical site","stem":"A technician inadvertently touches the sterile needle tip during aseptic preparation. What should happen next?","options":{"A":"Continue because the tip looked dry.","B":"Wipe the needle tip with a paper towel.","C":"Stop; treat the critical site as contaminated and replace appropriate sterile components following procedure.","D":"Shake the needle until clean."},"correct_answer":"C","explanation":"Touching a sterile critical site compromises aseptic technique; follow sterile replacement/correction protocol and pharmacist supervision.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":"Sterile compounding","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":60,"title":"Class I recalls","stem":"Which FDA recall class means use of a violative product presents a reasonable probability of serious harm or death?","options":{"A":"Class II","B":"Class I","C":"Class III","D":"Market withdrawal"},"correct_answer":"B","explanation":"Class I is the FDA's most serious recall category, with reasonable probability of serious adverse health consequences or death.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":61,"title":"Spironolactone","stem":"A prescription is received for Aldactone (spironolactone). Which diuretic class is correct?","options":{"A":"Loop diuretic","B":"Potassium-sparing diuretic","C":"Thiazide diuretic","D":"Osmotic diuretic"},"correct_answer":"B","explanation":"Spironolactone antagonizes aldosterone and is a potassium-sparing diuretic.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":62,"title":"Advair Diskus","stem":"Advair Diskus contains which two ingredients?","options":{"A":"Albuterol and ipratropium","B":"Budesonide and formoterol","C":"Fluticasone propionate and salmeterol","D":"Umeclidinium and vilanterol"},"correct_answer":"C","explanation":"Advair Diskus combines fluticasone propionate, an inhaled corticosteroid, with salmeterol, a long-acting beta-2 agonist.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":63,"title":"Famotidine","stem":"Pepcid (famotidine) belongs to which gastrointestinal drug class?","options":{"A":"Histamine H2-receptor antagonist","B":"Proton pump inhibitor","C":"Osmotic laxative","D":"Antiemetic"},"correct_answer":"A","explanation":"Famotidine blocks gastric H2 receptors to reduce acid secretion.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":64,"title":"Quetiapine","stem":"Seroquel (quetiapine) belongs to which therapeutic class?","options":{"A":"Selective serotonin reuptake inhibitor","B":"Benzodiazepine","C":"Anticonvulsant only","D":"Second-generation (atypical) antipsychotic"},"correct_answer":"D","explanation":"Quetiapine is a second-generation antipsychotic.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":65,"title":"Nexplanon","stem":"Nexplanon is an implantable contraceptive that contains which hormone?","options":{"A":"Ethinyl estradiol","B":"Levonorgestrel plus ethinyl estradiol","C":"Progesterone vaginal gel","D":"Etonogestrel"},"correct_answer":"D","explanation":"Nexplanon is a subdermal implant containing etonogestrel, a progestin.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"Reproductive mini-lesson","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":66,"title":"Mupirocin","stem":"Which drug class describes mupirocin 2% topical ointment?","options":{"A":"Topical antibiotic","B":"Topical azole antifungal","C":"High-potency corticosteroid","D":"Topical anesthetic"},"correct_answer":"A","explanation":"Mupirocin is a topical antibiotic for certain bacterial skin infections.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":67,"title":"EpiPen","stem":"EpiPen delivers epinephrine for emergency treatment of which condition?","options":{"A":"Type 2 diabetes","B":"Uncomplicated seasonal rhinitis","C":"Anaphylaxis","D":"Bacterial sinusitis"},"correct_answer":"C","explanation":"Epinephrine autoinjectors are indicated for immediate treatment of anaphylactic reactions; emergencies also require appropriate medical follow-up.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":68,"title":"Duplicate acetaminophen","stem":"A patient plans to use two OTC cold products, both containing acetaminophen. What should the technician do?","options":{"A":"Assume the ingredients cancel each other.","B":"Alert the pharmacist to duplicate therapy and potential excessive total acetaminophen dosing.","C":"Advise taking twice the label amount.","D":"Remove both warnings from labels."},"correct_answer":"B","explanation":"Acetaminophen appears in many combinations. Duplicate ingredients raise overdose risk and need pharmacist assessment.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":69,"title":"Medicare Part D","stem":"Which Medicare benefit generally covers eligible outpatient prescription medications through participating plans?","options":{"A":"Medicare Part D","B":"Medicare Part A","C":"Medicare Part B only in all situations","D":"Medigap as the primary drug plan"},"correct_answer":"A","explanation":"Medicare Part D provides outpatient prescription-drug benefit coverage through eligible plans, subject to benefit rules.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":70,"title":"Epinephrine ratio strength","stem":"An older epinephrine vial states “1:1,000” (1 g per 1,000 mL). How many mg/mL does this represent?","options":{"A":"0.1 mg/mL","B":"10 mg/mL","C":"1 mg/mL","D":"100 mg/mL"},"correct_answer":"C","explanation":"1 g = 1000 mg; 1000 mg/1000 mL = 1 mg/mL. Contemporary labels often favor mg/mL to prevent ratio-strength errors.","nha_alignment":null,"game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 ratio strength","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":71,"title":"Allopurinol","stem":"Zyloprim (allopurinol) lowers uric acid production by inhibiting which enzyme?","options":{"A":"Xanthine oxidase","B":"Cyclooxygenase","C":"HMG-CoA reductase","D":"Acetylcholinesterase"},"correct_answer":"A","explanation":"Allopurinol inhibits xanthine oxidase, reducing uric acid production in gout management.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":72,"title":"Sinemet","stem":"A label lists Sinemet 25/100. Which two drugs and strengths are in each tablet?","options":{"A":"Levodopa 25 mg and carbidopa 100 mg","B":"Carbidopa 25 mg and ropinirole 100 mg","C":"Carbidopa 25 mg and levodopa 100 mg","D":"Levodopa 100 mg and entacapone 25 mg"},"correct_answer":"C","explanation":"Sinemet 25/100 contains carbidopa 25 mg plus levodopa 100 mg.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":73,"title":"Bactrim DS","stem":"Which components and strengths are in one Bactrim DS tablet?","options":{"A":"Sulfamethoxazole 160 mg and trimethoprim 800 mg","B":"Amoxicillin 875 mg and clavulanate 125 mg","C":"Azithromycin 500 mg and trimethoprim 500 mg","D":"Sulfamethoxazole 800 mg and trimethoprim 160 mg"},"correct_answer":"D","explanation":"Bactrim DS contains sulfamethoxazole 800 mg plus trimethoprim 160 mg.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":74,"title":"Levothyroxine unit safety","stem":"A prescription states levothyroxine 50 mcg, but the entry screen shows 50 mg. What should the technician do?","options":{"A":"Dispense 50 mg because 50 is unchanged.","B":"Stop and correct/verify the unit before processing.","C":"Assume the patient can divide the tablet into 1,000 pieces.","D":"Change the drug to liothyronine without approval."},"correct_answer":"B","explanation":"50 mg equals 50,000 mcg, a thousandfold error. Microgram/milligram entries require careful verification.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":75,"title":"Insulin lispro","stem":"Humalog (insulin lispro) is primarily classified as which insulin type?","options":{"A":"Long-acting insulin glargine","B":"Intermediate-acting NPH insulin","C":"Rapid-acting insulin analogue","D":"Regular human insulin"},"correct_answer":"C","explanation":"Insulin lispro is a rapid-acting insulin analogue.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":76,"title":"Clotrimazole","stem":"Clotrimazole 1% topical cream belongs to which class?","options":{"A":"Topical antibacterial","B":"Antiviral","C":"Topical corticosteroid","D":"Azole antifungal"},"correct_answer":"D","explanation":"Clotrimazole is an azole antifungal used for certain superficial fungal infections.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":77,"title":"Narcan naloxone","stem":"Narcan 4 mg nasal spray contains which drug?","options":{"A":"Naloxone","B":"Naltrexone","C":"Buprenorphine","D":"Flumazenil"},"correct_answer":"A","explanation":"Narcan nasal spray contains naloxone, an opioid antagonist for suspected opioid overdose.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":78,"title":"Compounding BUD","stem":"How does a beyond-use date (BUD) for a compounded preparation differ from a manufacturer's expiration date?","options":{"A":"The BUD must always equal the manufacturer's original printed expiry.","B":"A BUD applies only to tablet colors.","C":"BUD is assigned to a compounded preparation based on applicable compounding standards and stability considerations.","D":"A BUD always extends the product's storage life."},"correct_answer":"C","explanation":"A beyond-use date is assigned to a compounded preparation; it is not automatically the same as the manufacturer's expiration date of its ingredients.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":"Compounding BUD","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":79,"title":"DEA Form 222","stem":"Which form is used for placing a paper order for Schedule II controlled substances through the DEA process?","options":{"A":"DEA Form 106","B":"DEA Form 41","C":"DEA Form 224","D":"DEA Form 222"},"correct_answer":"D","explanation":"DEA Form 222, or an authorized CSOS electronic order, is used to order Schedule I and II controlled substances.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":80,"title":"Prior authorization","stem":"A claim response states “Prior Authorization Required.” What is the appropriate technician action?","options":{"A":"Change the diagnosis to a covered condition.","B":"Bill another patient's plan.","C":"Follow the pharmacy's authorized prior-authorization workflow and alert the pharmacist/prescriber as appropriate.","D":"Tell the patient authorization is never possible."},"correct_answer":"C","explanation":"A prior-authorization rejection requires valid payer/prescriber procedures, not fabricated claim entries.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":81,"title":"Clopidogrel","stem":"Plavix (clopidogrel) is which type of antiplatelet medication?","options":{"A":"Direct factor Xa inhibitor","B":"P2Y12-receptor inhibitor","C":"Vitamin K antagonist","D":"HMG-CoA reductase inhibitor"},"correct_answer":"B","explanation":"Clopidogrel inhibits platelet P2Y12 receptors and is an antiplatelet agent.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":82,"title":"Spiriva HandiHaler","stem":"A prescription is written for Spiriva HandiHaler capsules. How should the capsules be used?","options":{"A":"Swallow the capsule with food.","B":"Place capsules in the HandiHaler device for inhalation; do not swallow them.","C":"Crush and mix capsule with water to drink.","D":"Use as a sublingual capsule."},"correct_answer":"B","explanation":"Spiriva HandiHaler capsules are for inhalation with the specified device; they are not oral capsules.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":83,"title":"Methimazole","stem":"Tapazole (methimazole) is used to treat which condition?","options":{"A":"Hypothyroidism requiring replacement","B":"Hyperthyroidism","C":"Iron-deficiency anemia","D":"High cholesterol"},"correct_answer":"B","explanation":"Methimazole is an antithyroid drug used for hyperthyroidism.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":84,"title":"Sumatriptan","stem":"Imitrex (sumatriptan) is generally used for which indication?","options":{"A":"Long-term bacterial infection prevention","B":"Acute migraine attack","C":"Diabetes management","D":"Chronic LDL lowering"},"correct_answer":"B","explanation":"Sumatriptan is a serotonin 5-HT1B/1D agonist used for acute migraine treatment, not routine prevention.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":85,"title":"Doxycycline","stem":"Doxycycline hyclate belongs to which antibiotic class?","options":{"A":"Macrolides","B":"Penicillins","C":"Tetracyclines","D":"Aminoglycosides"},"correct_answer":"C","explanation":"Doxycycline is a tetracycline-class antibiotic.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":86,"title":"Child-resistant packaging","stem":"Which federal law established child-resistant packaging requirements for many prescription and OTC products?","options":{"A":"Poison Prevention Packaging Act of 1970","B":"Controlled Substances Act only","C":"Kefauver–Harris Amendment","D":"HIPAA Privacy Rule"},"correct_answer":"A","explanation":"The Poison Prevention Packaging Act authorizes child-resistant packaging standards for covered household substances and medications, with specified exceptions.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":87,"title":"Nitroglycerin storage","stem":"What storage instruction is important for many sublingual nitroglycerin tablets?","options":{"A":"Transfer to a weekly plastic pill organizer regardless of labeling.","B":"Keep them in the original tightly closed glass container according to product labeling.","C":"Store tablets loose in a pocket.","D":"Crush all tablets and mix into liquid."},"correct_answer":"B","explanation":"Many sublingual nitroglycerin formulations are moisture/light sensitive and must remain in their labeled original container; verify the specific product instructions.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":88,"title":"NCC MERP Category B","stem":"An incorrect strength is selected during filling but caught before it reaches the patient. Under NCC MERP, which error category describes this?","options":{"A":"Category C","B":"Category B","C":"Category D","D":"Category E"},"correct_answer":"B","explanation":"Category B means an error occurred but did not reach the patient. Category C reaches the patient without harm.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":"NCC MERP index taught","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":89,"title":"Medication reconciliation","stem":"During medication reconciliation, which task is appropriate for a pharmacy technician?","options":{"A":"Independently discontinue therapies.","B":"Change doses to resolve interactions.","C":"Collect medication lists and alert the pharmacist to differences requiring clinical review.","D":"Decide which prescription is no longer clinically necessary."},"correct_answer":"C","explanation":"Technicians can gather and compare medication data and notify the pharmacist, who performs clinical assessment and medication changes.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":"Medication reconciliation","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":90,"title":"Automated cabinet discrepancy","stem":"An automated dispensing cabinet shows a controlled-substance count discrepancy. What should the technician do?","options":{"A":"Change the computer count to make it match.","B":"Ignore the mismatch until next month.","C":"Transfer a dose from another patient's drawer without documentation.","D":"Secure the process, report the discrepancy immediately, and follow the facility investigation procedure."},"correct_answer":"D","explanation":"Controlled-substance discrepancies require prompt reporting and reconciliation under facility and legal procedures.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":91,"title":"Digoxin","stem":"Lanoxin (digoxin) belongs to which therapeutic class?","options":{"A":"Loop diuretic","B":"Cardiac glycoside","C":"Statin","D":"ACE inhibitor"},"correct_answer":"B","explanation":"Digoxin is a cardiac glycoside that affects cardiac contractility and electrical conduction.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":92,"title":"Phenazopyridine","stem":"Pyridium (phenazopyridine) is correctly described as which medication type?","options":{"A":"Urinary anti-infective that treats bacteria","B":"Alpha-1 blocker","C":"Urinary analgesic, not an antibiotic","D":"Loop diuretic"},"correct_answer":"C","explanation":"Phenazopyridine provides symptomatic urinary-tract discomfort relief, not eradication of infection.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":93,"title":"Metoclopramide","stem":"Reglan (metoclopramide) has which gastrointestinal action?","options":{"A":"Prokinetic and antiemetic activity","B":"Proton pump inhibition","C":"Bulk-forming laxative activity","D":"H2-receptor inhibition"},"correct_answer":"A","explanation":"Metoclopramide has dopamine-antagonist antiemetic effects and promotes gastrointestinal motility.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":94,"title":"Lamotrigine new rash","stem":"A patient starting Lamictal (lamotrigine) reports a new rash. What should the technician do?","options":{"A":"Tell the patient every rash is harmless.","B":"Suggest doubling the next dose.","C":"Delete the allergy documentation.","D":"Promptly alert the pharmacist because serious skin reactions must be evaluated."},"correct_answer":"D","explanation":"Lamotrigine can cause serious rash including Stevens–Johnson syndrome. Refer immediately for pharmacist/medical assessment.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":95,"title":"Depo-Provera CI","stem":"Depo-Provera CI 150 mg/mL injection contains which medication?","options":{"A":"Medroxyprogesterone acetate","B":"Estradiol valerate","C":"Etonogestrel","D":"Drospirenone"},"correct_answer":"A","explanation":"Depo-Provera CI is medroxyprogesterone acetate 150 mg/mL intramuscular injectable contraceptive; distinguish it from other formulations.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":"Reproductive mini-lesson","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":96,"title":"Tall Man lettering","stem":"Tall Man lettering is especially helpful for which look-alike oral antidiabetic names?","options":{"A":"omeprazole and pantoprazole","B":"glipiZIDE and glyBURIDE","C":"acetaminophen and ibuprofen","D":"furosemide and hydrochlorothiazide"},"correct_answer":"B","explanation":"ISMP Tall Man lettering can highlight visually similar but different drug names such as glipiZIDE and glyBURIDE.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":97,"title":"Oral-liquid quantity","stem":"An oral suspension is 125 mg per 5 mL. Directions are 375 mg twice a day for 5 days. How many milliliters are needed?","options":{"A":"75 mL","B":"100 mL","C":"30 mL","D":"150 mL"},"correct_answer":"D","explanation":"375 mg × (5 mL/125 mg) = 15 mL/dose; twice daily = 30 mL/day; for 5 days = 150 mL.","nha_alignment":null,"game_category":"CALCULATIONS","curriculum_hold":"PHRA 1009 oral-liquid calculations","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":98,"title":"FEFO stock rotation","stem":"The same stock product has two lots expiring November 2026 and March 2027. Which should be used first if both are suitable?","options":{"A":"The November 2026 lot","B":"The March 2027 lot","C":"Whichever is physically closer to the counter","D":"Use both lots in the same counting tray without tracking"},"correct_answer":"A","explanation":"First-expiring-first-out (FEFO) prioritizes suitable products with the earlier expiration date.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":99,"title":"DEA Form 106","stem":"A pharmacy identifies a significant unexplained loss of a controlled substance. Which DEA form is used for theft/significant-loss reporting?","options":{"A":"DEA Form 222","B":"DEA Form 41","C":"DEA Form 106","D":"DEA Form 224"},"correct_answer":"C","explanation":"DEA Form 106 is used to report theft or significant loss of controlled substances; the registrant must also comply with applicable prompt reporting rules.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":100,"title":"Spironolactone potassium","stem":"A patient taking spironolactone asks whether to take an OTC potassium supplement. What should the technician do?","options":{"A":"Recommend doubling the supplement.","B":"Refer to the pharmacist because excess potassium (hyperkalemia) is possible.","C":"Assure that spironolactone always lowers potassium.","D":"Remove spironolactone from the medication profile."},"correct_answer":"B","explanation":"Spironolactone is potassium-sparing, so supplemental potassium can increase the risk of hyperkalemia.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":101,"title":"Carvedilol","stem":"Coreg (carvedilol) blocks which receptors as part of its blood-pressure and heart-failure effects?","options":{"A":"H1 histamine and H2 histamine receptors","B":"Opioid mu and kappa receptors","C":"Beta-adrenergic and alpha-1 adrenergic receptors","D":"Muscarinic and nicotinic receptors only"},"correct_answer":"C","explanation":"Carvedilol has nonselective beta-blocking and alpha-1-blocking activity.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":102,"title":"Fluconazole","stem":"Diflucan (fluconazole) belongs to which antifungal class?","options":{"A":"Triazole antifungal","B":"Echinocandin","C":"Polyene","D":"Allylamine"},"correct_answer":"A","explanation":"Fluconazole is a triazole antifungal.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":103,"title":"Pregabalin Schedule V","stem":"Under the federal Controlled Substances Act, pregabalin (Lyrica) is in which schedule?","options":{"A":"Schedule II","B":"Schedule I","C":"Schedule III","D":"Schedule V"},"correct_answer":"D","explanation":"Pregabalin is federally classified as Schedule V; additional state requirements may apply.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":104,"title":"Bupropion XL/SR mismatch","stem":"An order is for Wellbutrin XL 150 mg but the selected bottle is bupropion SR 150 mg. What is correct?","options":{"A":"Dispense SR because the strength number is identical.","B":"Stop because XL and SR have different release characteristics and the selected formulation is not the ordered product.","C":"Crush the SR tablet to recreate XL.","D":"Change the SIG without pharmacist authorization."},"correct_answer":"B","explanation":"Bupropion XL and SR are different extended-release formulations; matching drug and strength alone is insufficient.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":105,"title":"Levetiracetam","stem":"Keppra is the brand name for which medication?","options":{"A":"Levetiracetam","B":"Phenytoin","C":"Topiramate","D":"Pregabalin"},"correct_answer":"A","explanation":"Keppra is levetiracetam, an anticonvulsant.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":106,"title":"FDA Purple Book","stem":"Which FDA reference provides information about licensed biological products, biosimilars, and interchangeability determinations?","options":{"A":"Orange Book","B":"DEA Schedules","C":"Purple Book","D":"OSHA Safety Data Sheets"},"correct_answer":"C","explanation":"The FDA Purple Book contains information on licensed biological products and biosimilar/interchangeable products.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":107,"title":"NPI","stem":"What is the purpose of a National Provider Identifier (NPI)?","options":{"A":"To identify a prescription bottle's lot number","B":"To replace a patient's medication allergy list","C":"To encode the controlled substance schedule","D":"To uniquely identify a healthcare provider in covered administrative transactions"},"correct_answer":"D","explanation":"An NPI identifies healthcare providers for HIPAA-standard administrative transactions; it is not a DEA registration number.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":108,"title":"Simvastatin and grapefruit","stem":"A patient taking simvastatin asks about drinking grapefruit juice regularly. What is the appropriate technician response?","options":{"A":"Say grapefruit eliminates simvastatin interactions.","B":"Refer to the pharmacist because grapefruit can increase simvastatin exposure.","C":"Recommend taking double the simvastatin dose.","D":"Automatically substitute another statin."},"correct_answer":"B","explanation":"Grapefruit products can inhibit intestinal CYP3A4 and raise simvastatin exposure; pharmacist guidance is needed.","nha_alignment":null,"game_category":"PATIENT SAFETY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":109,"title":"Coordination of benefits","stem":"A patient has both primary and secondary pharmacy insurance. Which claim-submission sequence generally applies?","options":{"A":"Submit to the designated primary payer first, then coordinate the secondary claim as appropriate.","B":"Always bill the secondary payer first.","C":"Submit two unrelated claims without coordination.","D":"Enter an arbitrary payment amount to force the secondary claim."},"correct_answer":"A","explanation":"Coordination of benefits normally adjudicates the designated primary plan first, then a properly coordinated secondary claim.","nha_alignment":null,"game_category":"PHARMACY PRACTICE","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":110,"title":"Biennial DEA inventory","stem":"Under federal DEA regulations, what is the minimum frequency for a registered pharmacy's controlled-substance inventory after the initial inventory?","options":{"A":"Every five years","B":"Every six months federally without exception","C":"At least once every two years","D":"Only when the pharmacy changes ownership"},"correct_answer":"C","explanation":"Federal 21 CFR 1304.11 requires a biennial inventory at minimum; Texas generally requires annual inventories for applicable pharmacy classes, shown separately after answer reveal.","nha_alignment":null,"game_category":"LAW \u0026 REGULATIONS","curriculum_hold":"DEA inventory federal/Texas teaching","editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":"Texas law generally requires annual controlled-substance inventories for applicable pharmacy classes, even though the federal minimum is biennial. See TSBP 22 TAC §291.17 and DEA 21 CFR §1304.11."},{"id":111,"title":"Enoxaparin","stem":"Lovenox (enoxaparin) is which type of anticoagulant?","options":{"A":"Low-molecular-weight heparin (LMWH)","B":"Direct oral thrombin inhibitor","C":"Vitamin K antagonist","D":"Direct factor Xa inhibitor taken orally"},"correct_answer":"A","explanation":"Enoxaparin is a low-molecular-weight heparin anticoagulant administered by injection.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":112,"title":"Cephalexin","stem":"Keflex (cephalexin) belongs to which antibiotic class?","options":{"A":"Macrolide","B":"Fluoroquinolone","C":"First-generation cephalosporin","D":"Carbapenem"},"correct_answer":"C","explanation":"Cephalexin is a first-generation cephalosporin antibiotic.","nha_alignment":null,"game_category":"DRUGS \u0026 THERAPY","curriculum_hold":null,"editorial_state":"RECONSTRUCTED","ready_for_classroom":false,"after_answer_texas_note":null},{"id":113,"title":"Budesonide maintenance","stem":"Pulmicort Flexhaler (budesonide) is used in asthma as which medication?","options":{"A":"Rapid-acting rescue bronchodilator","B":"Inhaled corticosteroid maintenance controller","C":"Oral leukotriene receptor antagonist","D":"Short-acting anticholinergic nebulizer solution"},"correct_answer":"B","explanation":"Budesonide is an inhaled corticosteroid us
